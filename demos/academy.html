<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forma Studio — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#f7efe3;color:#29231f;font:16px/1.5 system-ui,sans-serif}header,main,footer{width:min(1120px,92%);margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid currentColor;gap:12px}a{color:inherit}button,input,select{font:inherit}button{cursor:pointer;border:0;padding:12px 18px;background:#ad492b;color:white;border-radius:4px}h1{font-size:clamp(48px,9vw,116px);line-height:.95;letter-spacing:-.07em;margin:30px 0}h2{font-size:clamp(28px,4vw,48px);letter-spacing:-.04em}section{padding:48px 0}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}.art{min-height:280px;display:grid;place-items:center;background:#ad492b;overflow:hidden;color:white}.art svg{width:90%;height:auto;animation:enter .8s both}.panel{border:1px solid currentColor;padding:24px;display:grid;gap:16px;max-width:680px}label{display:grid;gap:6px}input,select{width:100%;padding:12px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:4px}option{color:#222;background:#fff}output{font-size:48px;font-weight:700}footer{padding:30px 0;border-top:1px solid currentColor}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad492b;outline-offset:4px}@keyframes enter{from{opacity:.2;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:700px){.hero{grid-template-columns:1fr}.art{min-height:180px}header{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}body{background:#f8ebd8}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.07em}.hero{grid-template-columns:1fr;gap:8px}.art{min-height:180px;background:linear-gradient(100deg,#ad492b,#e5b075);justify-items:end}.art svg{width:min(320px,80%)}.panel{max-width:none;grid-template-columns:1fr 1fr;background:#fff9ee;border-color:#bd9b7e}.panel output,.panel p{grid-column:1/-1}header{position:sticky;top:0;z-index:5;background:inherit;backdrop-filter:blur(12px)}.hero h1{animation:enter .9s both}.art{transition:transform .5s}.art:hover{transform:scale(1.015)}.scene{padding:60px 0;border-top:1px solid currentColor;display:grid;grid-template-columns:1fr 1fr;gap:20px}.scene strong{font-size:clamp(30px,5vw,65px);line-height:1.05;letter-spacing:-.05em}.scene p{max-width:40ch}.scene.in{animation:enter .7s both}@media(max-width:700px){.hero,.scene,.panel{grid-template-columns:1fr!important;min-height:0}.scene{padding:30px 0}}</style><header><strong>Forma Studio</strong><a id="back" href="../index.html">Portefólio</a><button id="lang">EN</button></header><main><section class="hero"><div><small id="notice">CONCEITO FICTÍCIO · DEMONSTRAÇÃO</small><h1 id="headline"></h1><a href="#tool" id="cta"></a></div><div class="art" aria-hidden="true"><svg viewBox="0 0 300 220"><path d="M150 45L30 15V170L150 205L270 170V15Z" fill="#f7efe3"/><path d="M150 45V205M55 65L125 85M55 95L125 115M175 85L245 65M175 115L245 95" stroke="#ad492b" stroke-width="5"/></svg></div></section><section class="scene"><strong id="scene1">01 — Descobre cursos</strong><strong id="scene2">02 — Planeia a formação</strong></section><section id="tool"><h2 id="title"></h2><form class="panel" id="form"><label><span id="optionlabel"></span><select id="option"><option value="120">Digital marketing</option><option value="90">Excel</option><option value="150">Leadership / Liderança</option></select></label><label><span id="qtylabel"></span><input id="qty" type="number" min="1" max="500" value="1" required></label><output id="total" aria-live="polite"></output><label><span id="datelabel">Data pretendida</span><input type="date" required></label><button id="submit"></button><p id="result" role="status"></p></form></section></main><footer id="foot">Simulação local. Não envia dados nem efetua pagamentos.</footer><script>const pt=["Aprende hoje. Transforma amanhã.","Encontra a tua formação","Curso","Participantes","Simular candidatura"],en=["Learn today. Transform tomorrow.","Find your training","Course","Participants","Simulate application"];let english=new URLSearchParams(location.search).get('lang')==='en';const $=id=>document.getElementById(id);function calc(){const v=Number($('option').value),q=Number($('qty').value);$('total').textContent=new Intl.NumberFormat(english?'en-GB':'pt-PT',{style:'currency',currency:'EUR'}).format(v*q)}function render(){$('scene1').textContent=english?"01 — Discover courses":"01 — Descobre cursos";$('scene2').textContent=english?"02 — Plan your training":"02 — Planeia a formação";const t=english?en:pt;document.documentElement.lang=english?'en':'pt-PT';['headline','title','optionlabel','qtylabel','submit'].forEach((id,i)=>$(id).textContent=t[i]);$('cta').textContent=t[1]+' ↓';$('lang').textContent=english?'PT':'EN';$('back').href=english?'../en/index.html':'../index.html';$('back').textContent=english?'Portfolio':'Portefólio';$('notice').textContent=english?'FICTIONAL CONCEPT · DEMO':'CONCEITO FICTÍCIO · DEMONSTRAÇÃO';$('datelabel').textContent=english?'Preferred date':'Data pretendida';$('foot').textContent=english?'Local simulation. No data sent or payments made.':'Simulação local. Não envia dados nem efetua pagamentos.';$('result').textContent='';calc()}$('lang').onclick=()=>{english=!english;render()};$('form').oninput=calc;$('form').onsubmit=e=>{e.preventDefault();$('result').textContent=english?'Simulation completed. No actual booking was made.':'Simulação concluída. Não foi efetuada uma reserva real.'};render();if('IntersectionObserver'in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}));document.querySelectorAll('.scene').forEach(e=>io.observe(e))}</script></html>
