<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clara Home — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f6ed;color:#17372d;font:16px/1.5 system-ui,sans-serif}header,main,footer{width:min(1120px,92%);margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid currentColor;gap:12px}a{color:inherit}button,input,select{font:inherit}button{cursor:pointer;border:0;padding:12px 18px;background:#16745c;color:white;border-radius:4px}h1{font-size:clamp(48px,9vw,116px);line-height:.95;letter-spacing:-.07em;margin:30px 0}h2{font-size:clamp(28px,4vw,48px);letter-spacing:-.04em}section{padding:48px 0}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}.art{min-height:280px;display:grid;place-items:center;background:#16745c;overflow:hidden;color:white}.art svg{width:90%;height:auto;animation:enter .8s both}.panel{border:1px solid currentColor;padding:24px;display:grid;gap:16px;max-width:680px}label{display:grid;gap:6px}input,select{width:100%;padding:12px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:4px}option{color:#222;background:#fff}output{font-size:48px;font-weight:700}footer{padding:30px 0;border-top:1px solid currentColor}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #16745c;outline-offset:4px}@keyframes enter{from{opacity:.2;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:700px){.hero{grid-template-columns:1fr}.art{min-height:180px}header{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><header><strong>Clara Home</strong><a id="back" href="../index.html">Portefólio</a><button id="lang">EN</button></header><main><section class="hero"><div><small id="notice">CONCEITO FICTÍCIO · DEMONSTRAÇÃO</small><h1 id="headline"></h1><a href="#tool" id="cta"></a></div><div class="art" aria-hidden="true"><svg viewBox="0 0 300 220"><rect x="45" y="55" width="210" height="150" rx="5" fill="#e7f5dc"/><path d="M25 70L150 10L275 70" fill="none" stroke="white" stroke-width="12"/><rect x="125" y="125" width="50" height="80" fill="#16745c"/><path d="M65 95H110M190 95H235" stroke="#16745c" stroke-width="18"/></svg></div></section><section id="tool"><h2 id="title"></h2><form class="panel" id="form"><label><span id="optionlabel"></span><select id="option"><option value="35">Regular</option><option value="65">Deep / Profunda</option><option value="50">Office / Escritório</option></select></label><label><span id="qtylabel"></span><input id="qty" type="number" min="1" max="500" value="80" required></label><output id="total" aria-live="polite"></output><label><span id="datelabel">Data pretendida</span><input type="date" required></label><button id="submit"></button><p id="result" role="status"></p></form></section></main><footer id="foot">Simulação local. Não envia dados nem efetua pagamentos.</footer><script>const pt=["Uma casa leve. Uma vida mais simples.","Calcula o orçamento","Serviço","Área em m²","Simular reserva"],en=["A lighter home. A simpler life.","Estimate your quote","Service","Area in m²","Simulate booking"];let english=new URLSearchParams(location.search).get('lang')==='en';const $=id=>document.getElementById(id);function calc(){const v=Number($('option').value),q=Number($('qty').value);$('total').textContent=new Intl.NumberFormat(english?'en-GB':'pt-PT',{style:'currency',currency:'EUR'}).format(v+q*0.8)}function render(){const t=english?en:pt;document.documentElement.lang=english?'en':'pt-PT';['headline','title','optionlabel','qtylabel','submit'].forEach((id,i)=>$(id).textContent=t[i]);$('cta').textContent=t[1]+' ↓';$('lang').textContent=english?'PT':'EN';$('back').href=english?'../en/index.html':'../index.html';$('back').textContent=english?'Portfolio':'Portefólio';$('notice').textContent=english?'FICTIONAL CONCEPT · DEMO':'CONCEITO FICTÍCIO · DEMONSTRAÇÃO';$('datelabel').textContent=english?'Preferred date':'Data pretendida';$('foot').textContent=english?'Local simulation. No data sent or payments made.':'Simulação local. Não envia dados nem efetua pagamentos.';$('result').textContent='';calc()}$('lang').onclick=()=>{english=!english;render()};$('form').oninput=calc;$('form').onsubmit=e=>{e.preventDefault();$('result').textContent=english?'Simulation completed. No actual booking was made.':'Simulação concluída. Não foi efetuada uma reserva real.'};render();</script></html>
