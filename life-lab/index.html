<!doctype html><html lang="pt-PT"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LifeLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: aplicação de serviço público com carácter — barra lateral no computador, barra inferior no telemóvel; conteúdo em duas colunas (percurso + painel fixo) */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface2:#EEF0EC; --ink:#15191B; --muted:#5B6366; --line:#DFE3DE; --line2:#C9CFC9;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#E2EFEA; --ok:#1E7A4F; --bad:#B9412F;
  --tip-bg:#FBF1D9; --tip-ink:#6B4A0A; --tip-line:#E3B24F;
  --l-red:#C8503E; --l-blue:#3462C4; --l-green:#2F8A58; --l-violet:#6550C2; --l-amber:#B87C16; --l-teal:#16818F; --l-pink:#B64578; --l-slate:#5B687E;
  --f-ui:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-disp:"Newsreader", Georgia, "Times New Roman", serif;
  --r:14px; --shadow:0 1px 2px rgba(20,25,27,.05),0 4px 14px rgba(20,25,27,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1211; --surface:#171B1A; --surface2:#1F2523; --ink:#E8ECE9; --muted:#9BA5A1; --line:#2A3230; --line2:#3A4441;
  --accent:#5DC1A2; --accent-ink:#0F1211; --accent-soft:#1B2D27; --ok:#5DC795; --bad:#EE8670;
  --tip-bg:#2C2513; --tip-ink:#F0CF84; --tip-line:#8A6A22;
  --l-red:#E7826F; --l-blue:#7FA2EC; --l-green:#6CC08F; --l-violet:#A493EC; --l-amber:#E2AD55; --l-teal:#55BFCB; --l-pink:#E07CAA; --l-slate:#98A6BD;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1211; --surface:#171B1A; --surface2:#1F2523; --ink:#E8ECE9; --muted:#9BA5A1; --line:#2A3230; --line2:#3A4441;
  --accent:#5DC1A2; --accent-ink:#0F1211; --accent-soft:#1B2D27; --ok:#5DC795; --bad:#EE8670;
  --tip-bg:#2C2513; --tip-ink:#F0CF84; --tip-line:#8A6A22;
  --l-red:#E7826F; --l-blue:#7FA2EC; --l-green:#6CC08F; --l-violet:#A493EC; --l-amber:#E2AD55; --l-teal:#55BFCB; --l-pink:#E07CAA; --l-slate:#98A6BD;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.12;font-weight:700}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:3px}
.note{font-size:.82rem;color:var(--muted)}

/* moldura */
.app{min-height:100%}
.side{display:none}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mtop-r{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.mark{width:22px;height:22px;border-radius:7px;background:var(--accent);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--accent-ink);border-right-color:transparent;transform:rotate(45deg)}
.me-btn{border:0;background:none;padding:0}
.pin{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;flex:none}
.pin.sm{width:34px;height:34px;border-radius:10px;font-size:.92rem}
.langs{display:inline-flex;background:var(--surface2);border-radius:9px;padding:2px;gap:2px}
.langs button{border:0;background:none;border-radius:7px;padding:3px 8px;font-size:.76rem;font-weight:700;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.mnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:.68rem;font-weight:600;color:var(--muted);border-radius:10px}
.mnav button[aria-current="page"]{color:var(--accent)}
.mnav button[aria-current="page"] svg{background:var(--accent-soft);border-radius:8px;box-sizing:content-box;padding:2px 10px}
main{padding:20px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px;max-width:1180px;margin:0 auto}
.foot{margin-top:8px}
.d-only{display:none}
@media (min-width:1024px){
  .app{display:grid;grid-template-columns:248px 1fr}
  .mtop,.mnav,.m-only{display:none!important}
  .d-only{display:block}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:24px 16px 20px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:0 8px}
  main{padding:36px 40px 56px;gap:26px;width:100%}
}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{border:0;background:none;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;font-weight:600;color:var(--muted);text-align:left}
.snav button:hover{background:var(--surface2);color:var(--ink)}
.snav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.me-card{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.me-card:hover{border-color:var(--line2)}
.me-t{display:flex;flex-direction:column;min-width:0;flex:1}
.me-t b{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-t small{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-card .edit{font-size:.74rem;font-weight:700;color:var(--accent)}

/* tipografia de secção */
.sec-h{display:flex;flex-direction:column;gap:8px;max-width:720px}
.sec-h h2{font-family:var(--f-disp);font-weight:600;font-size:clamp(1.9rem,4.8vw,2.7rem);letter-spacing:-.015em;line-height:1.08}
.sec-h p{color:var(--muted);font-size:1.02rem;max-width:62ch}
.narrow{max-width:760px;width:100%;display:flex;flex-direction:column;gap:20px}
.setup{max-width:820px;display:flex;flex-direction:column;gap:20px}
.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}

/* botões */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:.9rem;text-align:left}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* estás aqui */
.here{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.here-t{min-width:0}
.here .lbl{font-size:.74rem}
.who{font-weight:700;font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:.74rem;border-radius:99px;padding:1px 8px;color:var(--muted);background:var(--surface2)}

/* destinos */
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.line-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s;box-shadow:var(--shadow)}
.line-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.line-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lb{width:28px;height:28px;border-radius:8px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.line-card b{font-size:1.08rem;font-weight:700;line-height:1.2}
.line-card small{color:var(--muted);font-size:.88rem;line-height:1.4}
.line-card .meta{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.minitrack{display:flex;align-items:center;justify-content:space-between;height:10px;position:relative;margin-top:4px}
.minitrack::before{content:"";position:absolute;left:0;right:0;top:4px;height:2px;background:color-mix(in srgb,var(--c) 35%,transparent)}
.minitrack i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--c);flex:none}
.minitrack i.h{background:var(--c)}

/* divisão em duas colunas */
.split{display:flex;flex-direction:column;gap:20px}
.col-main,.col-side{display:flex;flex-direction:column;gap:18px;min-width:0}
.sticky{display:flex;flex-direction:column;gap:14px}
@media (min-width:1024px){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
  .split.sim{grid-template-columns:minmax(0,1fr) 380px}
  .sticky{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;padding-bottom:6px}
}

/* plano */
.plan-h{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.back{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:.86rem;font-weight:600;padding:0}
.back:hover{color:var(--ink)}
.plan-title{display:flex;align-items:center;gap:12px}
.plan-title .lb{width:38px;height:38px;border-radius:10px;font-size:1rem}
.plan-h h2{font-family:var(--f-disp);font-weight:600;font-size:clamp(1.9rem,4.8vw,2.6rem);letter-spacing:-.015em}
.plan-h p{color:var(--muted);max-width:60ch}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:.74rem;color:var(--muted)}
@media (min-width:640px) and (max-width:1023px){.kpis{grid-template-columns:repeat(4,1fr)}}
.forks{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fork{display:flex;flex-direction:column;gap:7px}
.fork .q{font-weight:700;font-size:.92rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:.86rem;font-weight:600}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px var(--c,var(--accent))}
.hint{font-size:.8rem;color:var(--muted)}
.hint .linkbtn{font-size:.8rem}

/* paragens */
.map{display:flex;flex-direction:column}
.phase{display:flex;flex-direction:column}
.ph-h{display:flex;align-items:baseline;gap:10px;padding:16px 0 10px}
.ph-h .zone{font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.ph-h .age{font-size:.78rem;color:var(--muted)}
ol.stations{list-style:none;margin:0;padding:0;position:relative}
ol.stations:not(.flat)::before{content:"";position:absolute;left:11px;top:4px;bottom:4px;width:2px;background:color-mix(in srgb,var(--c) 40%,transparent)}
.st{position:relative;padding-left:36px;padding-bottom:8px}
ol.flat .st{padding-left:0}
.st .dot{position:absolute;left:4px;top:15px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c);z-index:1}
ol.flat .dot{display:none}
.st.ok .dot{background:var(--c)}
.st.have .dot{border-color:var(--line2);background:var(--surface2)}
.st-head{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.st-head:hover{border-color:var(--line2)}
.st.have .st-head{background:transparent}
.st.open .st-head{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.st-t{font-weight:700;font-size:.98rem;display:flex;justify-content:space-between;gap:10px;line-height:1.3}
.st.have .st-t,.st.ok .st-t{color:var(--muted)}
.chev{flex:none;color:var(--muted);transition:transform .2s;margin-top:1px}
.st.open .chev{transform:rotate(90deg)}
.st-m{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ent{font-size:.74rem;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--surface2);white-space:nowrap}
.tm{font-size:.76rem;color:var(--muted);white-space:nowrap}
.tag{font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 7px}
.tag.on{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tag.tip{color:var(--tip-ink);background:var(--tip-bg)}
.flag-have{font-size:.76rem;font-weight:600;color:var(--ok)}
.st-b{border:1px solid var(--line);border-top:0;background:var(--surface);border-radius:0 0 12px 12px;padding:4px 14px 16px;display:flex;flex-direction:column;gap:14px}
.where{font-size:.9rem;color:var(--muted)}
.where b{color:var(--ink);font-weight:700}
.how{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:8px}
.how li{counter-increment:h;display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.93rem}
.how li::before{content:counter(h);width:22px;height:22px;border-radius:50%;background:var(--surface2);font-size:.74rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.bring{font-size:.88rem;color:var(--muted)}
.bring b{color:var(--ink)}
.hid{background:var(--tip-bg);border-left:3px solid var(--tip-line);border-radius:8px;padding:10px 14px;color:var(--tip-ink);font-size:.92rem}
.hid b{display:block;font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.hid.sm{font-size:.84rem}
.impl{font-size:.9rem;background:var(--surface2);border-radius:8px;padding:10px 14px}
.impl b{display:block;font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.st-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:.86rem}
.links a{font-weight:600;word-break:break-all}
.tel{color:var(--muted)}
.tel b{color:var(--ink);user-select:all}
.tick{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.end-st{position:relative;padding:4px 0 0 36px}
.end-st .dot{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent)}
.end-st b{font-weight:800;font-size:1.05rem;display:block}
.end-st span{color:var(--muted);font-size:.9rem}

/* ajudante */
.helper{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.helper .ht{font-weight:700;font-size:.94rem}
.helper .ht small{display:block;font-weight:400;color:var(--muted);font-size:.84rem;margin-top:2px}
.helper .hb{display:flex;flex-wrap:wrap;gap:6px}
.helper .hb button{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.84rem;font-weight:600}
.helper .hb button:hover{border-color:var(--accent);color:var(--accent)}
.helper .hb button:disabled{opacity:.5;cursor:wait}
.hout{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.92rem;white-space:pre-wrap;line-height:1.5}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pl 1.2s ease-in-out infinite;flex:none}
@keyframes pl{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

/* caixas laterais */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.box summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.box summary::-webkit-details-marker{display:none}
.box summary b{font-weight:700;display:block;font-size:.95rem}
.box summary small{color:var(--muted);font-size:.8rem}
.box .num{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:8px;padding:2px 10px}
.box-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.visit{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--c,var(--accent));padding-left:10px}
.visit b{font-size:.9rem}
.visit span{font-size:.85rem;color:var(--muted)}
.visit em{font-style:normal;font-size:.8rem;color:var(--ok);font-weight:600}
.bag{display:flex;flex-direction:column;gap:4px}
.bag button{text-align:left;border:0;background:none;padding:3px 0;display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.bag button::before{content:"";width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);flex:none;margin-top:2px}
.bag button[aria-pressed="true"]{color:var(--muted);text-decoration:line-through}
.bag button[aria-pressed="true"]::before{background:var(--ok);border-color:var(--ok)}
.after{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.after h3{font-family:var(--f-disp);font-weight:600;font-size:1.45rem}
.fut{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fut div{background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.fut .when{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--accent))}
.fut p{font-size:.9rem}
.obl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* comparar */
.cmp-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cmp-wrap{overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.cmp{display:grid;grid-template-columns:repeat(var(--n),minmax(260px,1fr));gap:12px}
.col{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.col-h{border-top:4px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface));padding:12px;display:flex;flex-direction:column;gap:8px}
.col-top{display:flex;gap:6px;align-items:center}
.col-h select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-weight:700}
.rm{border:1px solid var(--line2);background:var(--surface);border-radius:8px;width:32px;height:32px;font-size:1.1rem;line-height:1;color:var(--muted);flex:none}
.fk{display:flex;flex-wrap:wrap;gap:4px}
.fkq{font-size:.74rem;color:var(--muted);width:100%;font-weight:600}
.fk button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.76rem;font-weight:600}
.fk button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);color:var(--ink)}
.cell{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.cell.row{flex-direction:row;justify-content:space-between;gap:10px;font-size:.88rem}
.cell .k{font-size:.74rem;color:var(--muted);font-weight:600}
.cell .v{font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.cell .v.best::after{content:attr(data-best);font-size:.66rem;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:99px;padding:1px 7px;margin-left:8px;vertical-align:middle}
.cell p{font-size:.86rem}
.cell ol{margin:0;padding-left:18px;font-size:.85rem;color:var(--muted)}
.good{color:var(--ok);font-weight:700}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.meter i.on{background:var(--c,var(--accent))}

/* simulador */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
textarea{width:100%;min-height:80px;resize:vertical;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.big{font-family:var(--f-disp);font-size:1.35rem;font-weight:500;min-height:64px}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.tpl button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.84rem;color:var(--muted)}
.tpl button:hover{border-color:var(--accent);color:var(--accent)}
.sim-head{display:flex;flex-direction:column;gap:8px}
.sim-head h2{font-family:var(--f-disp);font-weight:600;font-size:clamp(1.8rem,4.6vw,2.5rem);letter-spacing:-.015em}
.sim-head p{color:var(--muted)}
.branches{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.branches button{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 11px;font-weight:600;font-size:.84rem}
.branches button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px) and (max-width:1023px){.gauges{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.gn{font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv{display:flex;align-items:baseline;gap:6px;justify-content:space-between}
.gv b{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.gd{font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums}
.gd.good{color:var(--ok)} .gd.bad{color:var(--bad)}
.gauge svg{width:100%;height:24px;display:block}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line2)}
.tn{position:relative;padding:0 0 22px 34px}
.tn .dot{position:absolute;left:2px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);z-index:1}
.tn.cur .dot{background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent)}
.when{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.dec{display:inline-block;margin:6px 0 8px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:.9rem}
.tn .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.narr{font-family:var(--f-disp);font-size:1.12rem;line-height:1.5}
.cons{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.cons li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.9rem}
.ar{font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:6px;white-space:nowrap;margin-top:2px}
.ar.p{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.ar.n{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.ar.z{background:var(--surface2);color:var(--muted)}
.surprise{border:1px dashed var(--tip-line);border-radius:8px;padding:9px 12px;font-size:.9rem}
.surprise b{display:block;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tip-ink)}
details.onde{border:1px solid var(--line);border-radius:10px}
details.onde summary{padding:9px 12px;cursor:pointer;font-weight:600;font-size:.88rem;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.onde summary::-webkit-details-marker{display:none}
details.onde summary::after{content:"+";font-weight:800;color:var(--muted)}
details.onde[open] summary::after{content:"−"}
details.onde .ob{padding:0 12px 12px;display:flex;flex-direction:column;gap:14px}
.ondei{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.ondei a{font-weight:600;font-size:.86rem}
.mini-act{display:flex}
.decide{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.decide h3{font-family:var(--f-disp);font-weight:600;font-size:1.4rem}
.opts3{display:flex;flex-direction:column;gap:8px}
.opt3{text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:24px 1fr;gap:2px 10px;transition:border-color .15s}
.opt3:hover{border-color:var(--ink)}
.opt3 .k{grid-row:span 2;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:.76rem;color:var(--muted)}
.ot{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.ot b{font-weight:700;font-size:.94rem}
.opt3 small{color:var(--muted);font-size:.84rem}
.opt3[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt3[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.risk{font-size:.68rem;font-weight:700;border-radius:6px;padding:0 6px;white-space:nowrap}
.risk.baixo{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.risk.medio{background:var(--tip-bg);color:var(--tip-ink)}
.risk.alto{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.busy{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px}
.busy p{flex:1;font-weight:600}
.err{border-radius:10px;padding:10px 12px;font-size:.88rem;background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}

/* vida guiada */
.st-bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.agebig{font-weight:800;font-size:2.6rem;line-height:.9;font-variant-numeric:tabular-nums}
.agebig small{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-top:4px}
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 12px}
.ms div{display:flex;flex-direction:column;gap:3px;font-size:.76rem;color:var(--muted)}
.ms .row{display:flex;justify-content:space-between}
.ms b{color:var(--ink);font-variant-numeric:tabular-nums}
.ms b.neg{color:var(--bad)}
.bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar i.low{background:var(--bad)}
.scene{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.scene h2,.outcome h2,.event h2{font-family:var(--f-disp);font-weight:600;font-size:clamp(1.6rem,4.4vw,2.2rem)}
.outcome h3,.event h3{font-size:1rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:26px 1fr;gap:3px 10px;transition:border-color .15s}
.choice:hover{border-color:var(--accent)}
.choice .k{grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.78rem}
.choice b{font-weight:700}
.choice .tags{display:flex;flex-wrap:wrap;gap:5px}
.outcome,.event{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.event{border-style:dashed;border-color:var(--tip-line);background:var(--tip-bg)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.d{font-size:.78rem;font-weight:700;padding:1px 9px;border-radius:6px;background:var(--surface2)}
.d.up{color:var(--ok)} .d.dn{color:var(--bad)}
.story{border-left:2px solid var(--line2);margin-left:6px;display:flex;flex-direction:column}
.story div{padding:4px 0 12px 18px;position:relative;font-size:.93rem}
.story div::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.story span{font-size:.76rem;color:var(--muted);display:block}

/* mitos */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px;min-height:280px;box-shadow:var(--shadow)}
.quiz .n{font-size:.8rem;color:var(--muted);font-weight:600}
.quiz h3{font-family:var(--f-disp);font-weight:600;font-size:clamp(1.45rem,4vw,1.9rem);line-height:1.25}
.vm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vm button{border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:14px;font-weight:700;font-size:1.05rem;transition:border-color .15s,background .15s}
.vm button:first-child:hover{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.vm button:last-child:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.verdict{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.verdict.right{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.verdict.wrong{background:color-mix(in srgb,var(--bad) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.verdict a{font-size:.86rem;font-weight:600}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.dots i.r{background:var(--ok)} .dots i.w{background:var(--bad)} .dots i.c{outline:2px solid var(--ink);outline-offset:2px}

/* guia */
.search{width:100%;padding:11px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.filt{display:flex;flex-wrap:wrap;gap:6px}
.filt button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:.82rem;font-weight:600}
.filt button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* perfil */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,12,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(480px,100%);height:100%;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{font-family:var(--f-disp);font-weight:600;font-size:1.8rem}
.sheet-h p{color:var(--muted);font-size:.88rem;margin-top:4px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp > span,.grp > label{font-size:.8rem;color:var(--muted);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:.88rem;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.range{display:flex;align-items:center;gap:14px}
.range output{font-weight:800;font-size:1.8rem;min-width:2.4ch;font-variant-numeric:tabular-nums}
.range output.money{font-size:1.2rem;min-width:7ch}
.range input{flex:1;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-weight:700}
.stepper b{font-size:1.2rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.docs button{text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.84rem;font-weight:600;display:flex;gap:8px;align-items:center}
.docs button::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line2);flex:none}
.docs button[aria-pressed="true"]{border-color:var(--ok)}
.docs button[aria-pressed="true"]::before{background:var(--ok);border-color:var(--ok)}
/* ---- camada de personalidade ---- */
:root{--sun:#F2B23E;--side-bg:#11241E;--side-ink:#E4EEE9;--side-muted:#8FA99D;--side-hover:rgba(255,255,255,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sun:#F5C15E;--side-bg:#0B1713;--side-ink:#E4EEE9;--side-muted:#86A095;--side-hover:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--sun:#F5C15E;--side-bg:#0B1713;--side-ink:#E4EEE9;--side-muted:#86A095;--side-hover:rgba(255,255,255,.05)}
@media (min-width:1024px){
  .side{background:var(--side-bg);color:var(--side-ink);border-right:0}

  .side .me-card{background:var(--side-hover);border-color:transparent;color:var(--side-ink)}

  .side .langs button{color:var(--side-muted)}
  .side .langs button[aria-pressed="true"]{background:var(--side-ink);color:var(--side-bg)}
}
.sec-h h2 em,.hero h2 em{font-style:italic;color:var(--accent)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 25%,transparent)}
/* herói com linhas de vida */
.hero{display:grid;gap:8px;align-items:center}
.hero .sec-h h2{font-size:clamp(2.2rem,6vw,3.4rem)}
.lifelines{width:100%;max-width:560px;height:auto;justify-self:center}
.lifelines .grid line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 6}
.lifelines .ll{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards;animation-delay:var(--d)}
.lifelines .lln{opacity:0;animation:fadein .5s ease forwards;animation-delay:var(--d)}
.lifelines text{font-family:var(--f-ui);font-size:13px;font-weight:600;fill:var(--muted)}
.lifelines .ping{transform-origin:40px 150px;animation:ping 2.4s ease-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}

.plan-h.band::after{content:"";position:absolute;left:22px;right:22px;bottom:12px;height:3px;background:repeating-linear-gradient(90deg,var(--c) 0 18px,transparent 18px 26px);opacity:.5}

.st .dot{box-shadow:0 0 0 3px var(--bg)}

/* simulador mais vivo */
.gv{justify-content:flex-start}
.gv .gd{margin-left:auto}
.ring{width:30px;height:30px;flex:none}
.gauge{transition:border-color .2s}
.gauge:hover{border-color:var(--line2)}

.dec::before{content:"→ "}
.decide{border-top:4px solid var(--sun)}
.opt3:hover .k{border-color:var(--accent);color:var(--accent)}

/* mitos */

/* ---- paleta carvão + coral ---- */

  --tip-bg:#FDF0DC; --tip-ink:#6E4708; --tip-line:#E9A43B;
  --l-red:#C9462A; --l-blue:#3B5BD9; --l-green:#23855A; --l-violet:#6C4FD0; --l-amber:#B7700F; --l-teal:#13808E; --l-pink:#B83E7A; --l-slate:#5A6580;
  --sun:#F0A53A; --side-bg:#1A1822; --side-ink:#ECEAF3; --side-muted:#9A96AB; --side-hover:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(23,21,31,.05),0 6px 18px rgba(23,21,31,.05);
}

  --accent:#FF7B5A; --accent-ink:#17151F; --accent-soft:#3A2019; --ok:#4FCB8D; --bad:#F2706A;
  --tip-bg:#2F2412; --tip-ink:#F5C77A; --tip-line:#8C6420;
  --l-red:#FF7B5A; --l-blue:#83A0F5; --l-green:#62C793; --l-violet:#A891F2; --l-amber:#EDB25A; --l-teal:#4FC0CC; --l-pink:#EE7FB4; --l-slate:#A0AAC2;
  --sun:#F5B55A; --side-bg:#0D0C12; --side-ink:#ECEAF3; --side-muted:#8E8A9E; --side-hover:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118; --surface:#1B1A23; --surface2:#24222E; --ink:#ECEAF3; --muted:#A39FB2; --line:#2E2C39; --line2:#403D4E;
  --accent:#FF7B5A; --accent-ink:#17151F; --accent-soft:#3A2019; --ok:#4FCB8D; --bad:#F2706A;

.tm-ev li>span,.tm-ev li>.linkbtn{font-size:.76rem;color:var(--muted);text-transform:capitalize;text-align:left}
.tm-ev li.ok{border-left-color:var(--ok)}.tm-ev li.alt,.tm-ev li.warn{border-left-color:var(--l-amber)}.tm-ev li.bad{border-left-color:var(--bad)}.tm-ev li.money{border-left-color:var(--l-blue)}.tm-ev li.later{border-left-color:var(--l-violet)}
.tmdl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tmd{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px;border-radius:12px;background:var(--surface2);border:1px solid transparent}
.tmd.alt{border-color:color-mix(in srgb,var(--l-amber) 50%,transparent)}.tmd.skip{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.tmd-m{font-size:.76rem;color:var(--muted);text-transform:capitalize;padding-top:2px}
.tmd-b{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.tmd-b b{flex:1 1 100%;font-size:.92rem}
.seg.sm button{padding:5px 9px;font-size:.78rem}
.brc{display:inline-flex;align-items:center;gap:2px}.brc i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.brc .x{border:0;background:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:0 6px}
.tm-t{width:100%;border-collapse:collapse;font-size:.84rem}.tm-t th,.tm-t td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}.tm-t th:first-child,.tm-t td:first-child{text-align:left}
.tm-t td i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.tm-t tr.on td{font-weight:700}
.tmcta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px;margin:18px 0;border-radius:16px;background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}
.tmcta b{display:flex;align-items:center;gap:8px;font-size:1.02rem}.tmcta p{margin:.3rem 0 0;max-width:56ch;color:var(--muted);font-size:.9rem}
.hk .hb button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hk-p{display:grid;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.hk-p textarea{width:100%;min-height:200px;font:inherit;font-size:.88rem;line-height:1.45}
.hk-p input[type=email],.hk-p input[type=text]{width:100%}
.hk-pre{white-space:pre-wrap;margin:0;padding:12px;border-radius:12px;background:var(--surface2);font:inherit;font-size:.9rem;line-height:1.5}
.hk-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}.hk-list label{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.4;cursor:pointer}
.hk-list input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok)}
.calc{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface2);margin-bottom:10px}
.calc h4{margin:0;font-size:.95rem}.cin{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cout{display:grid;gap:4px}.cr{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:9px;background:var(--surface);font-size:.86rem}
.cr b{text-align:right}.cr.strong{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}.cr.strong b{font-size:1rem}
.calc .note{margin:0}

.tm{min-width:0;max-width:100%}.tm .split{min-width:0}.tm .split>*{min-width:0}.tm-ev li,.tm-ev li>*,.tmd-b{min-width:0;overflow-wrap:anywhere}
.tm-head>div:first-child{flex:1 1 360px;min-width:0}.tm .forks .seg{flex-wrap:wrap}.tm .numf{min-width:0}.tm .numf input{min-width:0;max-width:130px}
.tm .box-h small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.tm-ev li{grid-template-columns:86px minmax(0,1fr)}.tmd{grid-template-columns:86px minmax(0,1fr)}
.tm p,.tm li,.tm .hint,.tm .note,.tm span{white-space:normal}
.tm .nums .numf{display:grid;grid-template-columns:1fr;gap:4px}.tm .nums .numf input{max-width:none;width:100%}
@media (max-width:700px){.tm-ev li,.tmd{grid-template-columns:1fr;gap:2px}}
.tm-gauges .gauge{min-width:0}.tm-gauges small,.tm small{white-space:normal;overflow-wrap:anywhere}
.hk-p textarea{font-weight:400}
.tm-spins{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.spin{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.spin-l{font-size:.8rem;color:var(--muted);margin-right:2px}.spin b{min-width:74px;text-align:center;font-size:.95rem}
.spin .sb{width:32px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.8rem;cursor:pointer}
.spin .sb:hover:not(:disabled){border-color:var(--c,var(--accent))}.spin .sb:disabled{opacity:.3;cursor:default}
.spin.quick{padding:4px;gap:4px}.qj{padding:5px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink);font-size:.8rem;cursor:pointer}
.qj[aria-pressed="true"]{background:var(--c,var(--accent));color:#fff}
.tm-btns .ib{white-space:nowrap}

<script>
const S={
cc:{t:"Cartão de Cidadão válido",e:"CID",w:2,c:18,h:["Marca atendimento no ePortugal (ou vai sem marcação e espera mais).","Vai a uma Loja do Cidadão, Espaço Cidadão ou Conservatória.","Tiram fotografia, impressões digitais e assinatura no balcão.","Recebes os códigos PIN por carta e levantas o cartão no mesmo sítio."],l:"Cartão antigo",x:"Podes renovar até 6 meses antes de caducar. Sem cartão válido não ativas a Chave Móvel Digital nem tratas de quase nada online.",u:"https://eportugal.gov.pt/"},
registoue:{t:"Certificado de registo de cidadão da UE",e:"LOCAL",w:1,c:15,h:["Ao fim de 3 meses em Portugal, vai à Câmara Municipal da zona onde vives.","Pede o certificado de registo de cidadão da UE.","Mostra identificação e prova da tua situação: trabalho, estudo ou meios próprios.","Guarda o certificado: bancos, centro de saúde e senhorios vão pedi-lo."],l:"Passaporte ou cartão de identidade, comprovativo de morada",x:"Muitos cidadãos europeus nunca o pedem e depois não conseguem provar residência. Ao fim de 5 anos podes pedir o de residência permanente.",u:"https://eportugal.gov.pt/"},
visto:{t:"Pedir o visto certo no consulado",e:"CONS",w:10,c:90,h:["Escolhe o visto pelo motivo: trabalho com contrato, estudo, procura de trabalho qualificado, rendimentos próprios ou trabalho remoto.","Marca no consulado ou centro de vistos de Portugal no teu país.","Junta registo criminal, seguro de saúde, meios de subsistência e alojamento.","Depois de aprovado, entras em Portugal dentro da validade do visto."],l:"Passaporte válido, registo criminal, provas de meios",x:"A manifestação de interesse (entrar como turista e regularizar depois) acabou. Hoje o caminho começa quase sempre com um visto pedido no país de origem.",u:"https://vistos.mne.gov.pt/"},
aima:{t:"Autorização de residência na AIMA",e:"AIMA",w:20,c:[100,200],h:["Faz o agendamento na AIMA dentro da validade do visto.","Leva passaporte, visto, NIF, morada e provas do motivo (contrato, matrícula, rendimentos).","Recolhem dados biométricos e pagas as taxas.","O título chega por correio. Até lá, guarda o comprovativo do processo."],l:"Passaporte, visto, NIF, comprovativo de morada e de meios",x:"Os tempos de espera são longos: o comprovativo de agendamento prova que estás em processo. Trazer família por reagrupamento passou, em regra, a exigir 2 anos de residência.",i:"Com o título de residência já podes pedir NISS, número de utente e Chave Móvel Digital.",u:"https://aima.gov.pt/"},
nif:{t:"Ter NIF",e:"AT",w:1,c:0,h:["Cidadãos portugueses já têm NIF ligado ao Cartão de Cidadão.","Estrangeiros pedem num Serviço de Finanças com passaporte e comprovativo de morada.","Quem não reside na UE pode precisar de representante fiscal em Portugal."],l:"Identificação e comprovativo de morada",x:"Há empresas que cobram para tratar do NIF. Nas Finanças, pedi-lo é gratuito.",u:"https://www.portaldasfinancas.gov.pt/"},
iban:{t:"Conta bancária portuguesa",e:"BANCO",w:1,c:0,h:["Compara comissões: há contas grátis para jovens e contas de serviços mínimos.","Leva identificação, NIF e comprovativo de morada.","Abre ao balcão ou online por videochamada."],x:"Tens direito a uma conta de serviços mínimos bancários com comissões muito baixas, mesmo com pouco dinheiro.",u:"https://clientebancario.bportugal.pt/"},
niss:{t:"Ter NISS (Segurança Social)",e:"SS",w:1,c:0,h:["Se já trabalhaste em Portugal, vês o teu NISS na Segurança Social Direta.","Senão, pede online ou num balcão da Segurança Social.","Estrangeiros pedem ao balcão com título de residência ou comprovativo do processo e NIF."],x:"Sem NISS a empresa não te inscreve. Confirma de vez em quando na Segurança Social Direta se os descontos estão mesmo a ser feitos.",u:"https://www.seg-social.pt/"},
cmd:{t:"Ativar a Chave Móvel Digital",e:"CID",w:0,c:0,h:["Tem à mão o cartão de identificação ou título de residência e o telemóvel.","Ativa na app gov.pt, online com leitor de cartão, ou numa Loja do Cidadão.","Escolhes um PIN; a cada acesso recebes um código por SMS."],x:"Com ela entras nas Finanças, Segurança Social e SNS 24, e assinas documentos digitalmente sem sair de casa.",u:"https://www.autenticacao.gov.pt/chave-movel-digital"},
utente:{t:"Número de utente e médico de família",e:"SNS",w:2,c:0,h:["Vai ao centro de saúde ou USF da tua área de residência.","Leva identificação, NIF e comprovativo de morada.","Pede inscrição e médico de família. Se não houver vaga, ficas em lista mas podes ter consultas."],x:"Antes de ir à urgência liga para o SNS 24 (808 24 24 24): se fores referenciado(a), evitas a taxa moderadora e esperas menos.",u:"https://www.sns24.gov.pt/"},
carta:{t:"Carta de condução",e:"IMT",w:12,c:[700,1100],h:["Inscreve-te numa escola de condução (aulas de código e de condução).","Faz o exame de código e depois o de condução, marcados pela escola.","A carta é emitida pelo IMT."],l:"Identificação, atestado médico, fotografia",x:"Quem tem carta de fora da UE pode ter prazo para a trocar depois de obter residência. Fora do prazo, pode ter de fazer exame.",u:"https://www.imt-ip.pt/"},
votar:{t:"Saber onde votas",e:"CID",w:0,c:0,h:["O recenseamento é automático pela morada do teu Cartão de Cidadão.","Confirma o local de voto no portal do recenseamento antes de cada eleição."],x:"Se mudares de casa e não atualizares a morada no cartão, continuas a votar na freguesia antiga.",u:"https://www.recenseamento.mai.gov.pt/"},
morada:{t:"Atualizar a morada",e:"CID",w:0,c:0,h:["Muda a morada do Cartão de Cidadão online com a Chave Móvel Digital ou num balcão.","Confirma o código que recebes por carta na nova morada.","A morada fiscal nas Finanças atualiza com o cartão."],x:"A morada decide o teu centro de saúde, a escola dos filhos, onde votas e a que Junta pedes atestados.",u:"https://eportugal.gov.pt/"},
// ---- Estudo
exames:{t:"Inscrever-te nos exames nacionais",e:"ESC",w:4,c:0,h:["Vê que exames de ingresso pede o curso que queres.","Inscreve-te na secretaria da escola secundária nos prazos do JNE.","As notas contam para a média de candidatura."],x:"Podes repetir exames para subir a nota de ingresso, mesmo depois de acabares o secundário.",u:"https://www.dges.gov.pt/"},
candidatura:{t:"Candidatar-te ao ensino superior",e:"DGES",w:6,c:0,h:["Pede a senha de candidatura no site da DGES.","Na 1.ª fase (verão) escolhes até 6 pares curso/instituição.","Se não entrares, há 2.ª e 3.ª fase com as vagas sobrantes.","Depois de colocado(a), fazes a matrícula na instituição."],x:"Há contingentes especiais (ilhas, emigrantes, deficiência) e regimes especiais que muita gente desconhece.",u:"https://www.dges.gov.pt/"},
m23:{t:"Concurso Maiores de 23",e:"ESC",w:16,c:[50,150],h:["Vê se a instituição tem vagas para Maiores de 23 no curso que queres.","Inscreve-te nas provas da própria instituição (escrita e entrevista).","Se fores aprovado(a), candidatas-te às vagas desse concurso."],x:"Com 23 anos ou mais, entras no ensino superior sem exames nacionais e sem média do secundário.",u:"https://www.dges.gov.pt/"},
mestrado:{t:"Candidatura a mestrado",e:"ESC",w:8,c:[50,100],h:["Escolhe mestrados e vê as fases de candidatura de cada universidade.","Prepara CV, carta de motivação e certificado de notas.","Candidata-te diretamente no portal da universidade."],x:"Muitas universidades têm várias fases; nas últimas há menos vagas mas também menos concorrência.",u:"https://www.dges.gov.pt/"},
ctesp:{t:"Candidatar-te a um CTeSP",e:"ESC",w:4,c:0,h:["Escolhe um curso técnico superior profissional num politécnico.","Candidata-te diretamente no politécnico.","Inclui estágio numa empresa no último semestre."],x:"Sem exames nacionais obrigatórios. Depois podes prosseguir para licenciatura com equivalências.",u:"https://www.dges.gov.pt/"},
mooc:{t:"Curso curto online",e:"TU",w:6,c:0,h:["Procura cursos gratuitos de instituições portuguesas na plataforma NAU.","Escolhe um com certificado.","Junta o certificado ao CV e ao LinkedIn."],x:"Cursos curtos não substituem um grau, mas mostram iniciativa a quem contrata e ajudam a testar se gostas da área.",u:"https://www.nau.edu.pt/"},
bolsa:{t:"Pedir bolsa da DGES",e:"DGES",w:4,c:0,h:["Entra na plataforma BeOn da DGES.","Preenche com os rendimentos do teu agregado.","Candidata-te todos os anos letivos, dentro dos prazos."],l:"IRS do agregado e NIF de todos",x:"Inclui complemento de alojamento se estudares longe de casa. Pedir fora de prazo pode fazer-te perder meses de bolsa.",u:"https://www.dges.gov.pt/"},
te:{t:"Estatuto de trabalhador-estudante",e:"ESC",w:1,c:0,h:["Pede nos serviços académicos.","Entrega declaração da entidade patronal.","Informa a empresa dos teus horários e exames."],x:"Tens direito a faltar no dia do exame e no dia anterior sem perder salário, e a horários ajustados.",u:"https://www.act.gov.pt/"},
passe:{t:"Passe de transportes",e:"LOCAL",w:1,c:0,h:["Pede no operador da tua zona (na área de Lisboa, o navegante).","Leva identificação e, se estudares, declaração de matrícula."],x:"Estudantes do ensino superior até aos 23 anos têm direito a passe gratuito.",u:"https://www.navegante.pt/"},
erasmus:{t:"Candidatar-te ao Erasmus+",e:"ESC",w:12,c:0,h:["Fala com o Gabinete de Relações Internacionais da tua faculdade.","As candidaturas abrem cerca de um ano antes.","Assinas um acordo de estudos com as cadeiras a fazer fora."],x:"Erasmus+ não é só para estudar: recém-diplomados podem fazer estágio no estrangeiro até 12 meses depois do curso.",u:"https://www.erasmusmais.pt/"},
reconhecer:{t:"Reconhecer um diploma estrangeiro",e:"DGES",w:8,c:[30,600],h:["Vê na DGES que tipo de reconhecimento precisas (automático, de nível ou específico).","Faz o pedido numa universidade pública ou na DGES.","Para profissões reguladas, pede também inscrição na Ordem profissional."],x:"Para psicologia, saúde, engenharia ou advocacia, o reconhecimento do grau não chega: a Ordem tem requisitos próprios.",u:"https://www.dges.gov.pt/"},
// ---- Emprego
iefp:{t:"Inscrever-te no IEFP",e:"IEFP",w:1,c:0,h:["Cria conta no IEFPonline ou vai ao centro de emprego da tua zona.","Marca entrevista com um técnico.","Ficas com acesso a ofertas, formação e estágios."],l:"Identificação, NISS, certificado de habilitações",x:"Estar inscrito(a) abre a porta a estágios e apoios que não aparecem em mais lado nenhum.",u:"https://iefponline.iefp.pt/"},
garantiajovem:{t:"Garantia Jovem",e:"IEFP",w:1,c:0,h:["Para quem tem até 29 anos e não está a trabalhar nem a estudar.","Regista-te online.","Recebes propostas de emprego, estágio ou formação."],x:"É uma das portas mais rápidas para um estágio pago.",u:"https://www.garantiajovem.pt/"},
ces:{t:"Corpo Europeu de Solidariedade",e:"UE",w:8,c:0,h:["Cria perfil no Portal Europeu da Juventude (18 a 30 anos).","Candidata-te a projetos de voluntariado noutro país.","Viagem, alojamento e subsídio estão incluídos."],x:"Conta como experiência internacional no CV e é pago.",u:"https://youth.europa.eu/solidarity_pt"},
contrato:{t:"Ler o contrato antes de assinar",e:"ACT",w:0,c:0,h:["Confirma tipo de contrato, salário, horário e local.","Vê o período experimental (em regra 90 dias; mais para primeiro emprego).","Pede sempre cópia assinada."],x:"No período experimental, qualquer das partes pode terminar sem justificação. Depois de 60 dias já é preciso aviso prévio.",u:"https://www.act.gov.pt/"},
act:{t:"Queixa na ACT",e:"ACT",w:2,c:0,h:["Junta recibos, contrato e mensagens.","Faz a denúncia online ou presencialmente na ACT.","Confirma os descontos na Segurança Social Direta."],x:"A denúncia pode ser feita sem revelares a tua identidade ao empregador.",u:"https://www.act.gov.pt/"},
estagio:{t:"Estágio ATIVAR.PT",e:"IEFP",w:6,c:0,h:["Inscreve-te no IEFP.","Procura ofertas de estágio no IEFPonline ou pede a uma empresa que se candidate contigo.","O estágio é pago e tem orientador."],x:"Não é só para recém-licenciados: há condições para quem muda de área e para desempregados com mais idade.",u:"https://iefponline.iefp.pt/"},
irsjovem:{t:"Ativar o IRS Jovem",e:"AT",w:0,c:0,h:["Até aos 35 anos, parte do rendimento do trabalho fica isenta de IRS durante 10 anos.","Pede ao empregador que o aplique já na retenção mensal.","Confirma na declaração anual."],x:"Os anos sem rendimentos não gastam os teus 10 anos de benefício.",u:"https://www.portaldasfinancas.gov.pt/"},
eures:{t:"Procurar trabalho na UE (EURES)",e:"UE",w:8,c:0,h:["Pesquisa ofertas no portal EURES.","Fala com um conselheiro EURES no IEFP.","Prepara CV no formato Europass."],x:"Os conselheiros EURES ajudam com contratos, impostos e segurança social do país de destino.",u:"https://eures.europa.eu/"},
cv:{t:"CV e LinkedIn para a nova área",e:"TU",w:2,c:0,h:["Lista o que já fazes e traduz para a linguagem da nova área.","Põe projetos e formação recente no topo.","Pede a 2 pessoas da área que revejam."],x:"Competências transferíveis (gerir pessoas, atender clientes, organizar) pesam mais do que o nome do cargo antigo."},
rede:{t:"Conversas com quem já lá está",e:"TU",w:4,c:0,h:["Identifica 5 a 10 pessoas na área que queres.","Pede 20 minutos para perguntar como é o dia a dia.","Pergunta: o que gostavas de ter sabido antes?"],x:"Muitas vagas são preenchidas por indicação antes de serem anunciadas."},
qualifica:{t:"Orientação num Centro Qualifica",e:"IEFP",w:3,c:0,h:["Procura o Centro Qualifica mais perto.","Marca sessão de diagnóstico e orientação (gratuita).","Sais com um plano: formação, certificação ou ambos."],x:"Estes centros existem para adultos de qualquer idade e são gratuitos.",u:"https://www.qualifica.gov.pt/"},
rvcc:{t:"Certificar o que já sabes (RVCC)",e:"IEFP",w:20,c:0,h:["No Centro Qualifica pede um processo RVCC escolar ou profissional.","Constróis um portefólio com a tua experiência.","Apresentas a um júri, que certifica as competências."],x:"Anos de experiência podem valer um certificado de 9.º ou 12.º ano, ou profissional, sem voltar às aulas.",u:"https://www.qualifica.gov.pt/"},
formacao:{t:"Formação certificada",e:"IEFP",w:16,c:0,h:["Vê as formações modulares e cursos de educação e formação de adultos (EFA).","Inscreve-te no centro de formação do IEFP ou entidade certificada.","Algumas dão bolsa e subsídio de transporte."],x:"Se trabalhas por conta de outrem, tens direito a 40 horas de formação por ano pagas pela empresa.",u:"https://www.iefp.pt/"},
saida:{t:"Sair do emprego com segurança",e:"ACT",w:8,c:0,h:["Respeita o aviso prévio (30 dias até 2 anos de casa, 60 dias depois).","Entrega a carta de denúncia por escrito e guarda cópia.","Pede o pagamento de férias e subsídios proporcionais."],x:"Se te despedires por tua iniciativa (sem justa causa), não tens direito a subsídio de desemprego.",i:"A partir daqui o teu rendimento depende só do novo caminho.",u:"https://www.act.gov.pt/"},
paralelo:{t:"Conciliar com o emprego atual",e:"ACT",w:0,c:0,h:["Lê o contrato: procura cláusulas de exclusividade ou de não concorrência.","Não uses tempo, clientes nem material do empregador.","Define o momento de saída: por exemplo, quando o novo rendimento cobrir 3 meses de salário."],x:"Sem cláusula de exclusividade podes ter atividade paralela, desde que não faças concorrência ao teu empregador.",u:"https://www.act.gov.pt/"},
desemprego:{t:"Pedir subsídio de desemprego",e:"SS",w:3,c:0,h:["Pede ao empregador a declaração de situação de desemprego.","Inscreve-te no IEFP.","Faz o pedido na Segurança Social Direta até 90 dias depois de ficares sem trabalho."],x:"Depois dos 90 dias perdes dias de subsídio. Despedires-te por tua iniciativa não dá direito.",u:"https://www.seg-social.pt/"},
// ---- Negócio
validar:{t:"Validar a ideia antes de gastar",e:"TU",w:6,c:[0,200],h:["Fala com 15 a 20 potenciais clientes antes de criar seja o que for.","Testa uma versão mínima: uma página, uma amostra, um serviço feito à mão.","Calcula quantas vendas por mês precisas para cobrir custos."],x:"A maioria dos negócios falha por falta de clientes, não por falta de papéis. Valida primeiro, regista depois.",i:"Se ninguém pagar, poupaste meses e dinheiro."},
planonegocio:{t:"Plano e conversa com um contabilista",e:"OCC",w:3,c:[50,150],h:["Faz uma previsão de 12 meses: vendas, custos fixos, custos variáveis.","Leva-a a um contabilista certificado e pergunta qual a melhor forma jurídica.","Decide quanto te vais pagar e quanto fica para impostos."],x:"Uma hora com um contabilista antes de abrir pode poupar-te centenas de euros em impostos mal escolhidos.",u:"https://www.occ.pt/"},
montanteunico:{t:"Receber o subsídio de desemprego de uma vez",e:"IEFP",w:8,c:0,h:["Tens de estar a receber subsídio de desemprego e inscrito(a) no IEFP.","Apresentas ao IEFP o projeto de criação do próprio emprego.","Se for aprovado, recebes as prestações que faltam num só pagamento, para investir."],x:"Pouca gente sabe que o subsídio de desemprego pode ser antecipado de uma vez para criares o teu negócio.",i:"Deixas de receber o subsídio todos os meses; o dinheiro vai para o negócio.",u:"https://www.iefp.pt/"},
apoios:{t:"Candidatar-te a apoios públicos",e:"LOCAL",w:10,c:0,h:["Vê os programas abertos na Startup Portugal e no IEFP.","Fala com o gabinete de empreendedorismo ou a incubadora da tua câmara.","Prepara orçamento, plano e documentos com antecedência."],x:"Os apoios abrem por avisos com prazos curtos. Consegue quem já tem o plano pronto quando o aviso sai.",u:"https://startupportugal.com/"},
microcredito:{t:"Microcrédito ou crédito bancário",e:"BANCO",w:6,c:0,h:["Compara linhas de crédito com garantia mútua em vários bancos.","Se o banco recusar, o microcrédito existe para quem tem pouco acesso a crédito.","Lê a TAEG e as garantias pessoais pedidas."],x:"Muitos créditos a pequenos negócios pedem aval pessoal: se o negócio fechar, a dívida continua a ser tua.",u:"https://clientebancario.bportugal.pt/"},
atividade:{t:"Abrir atividade nas Finanças",e:"AT",w:0,c:0,h:["Entra no Portal das Finanças com a Chave Móvel Digital.","Vai a Serviços > Atividade > Início e escolhe o código da tua atividade.","Escolhe o regime simplificado e, se faturares até 15.000 € por ano, a isenção de IVA.","A cada pagamento, emites fatura-recibo no Portal."],x:"Acima de 15.000 € de faturação passas ao regime normal de IVA no ano seguinte. Acima de 18.750 € a mudança é imediata, já na fatura que passa o limite.",i:"Daqui para a frente: declaração trimestral à Segurança Social e anexo B no IRS.",u:"https://www.portaldasfinancas.gov.pt/"},
ssindep:{t:"Segurança Social como independente",e:"SS",w:0,c:0,h:["A inscrição é automática quando abres atividade.","Nos primeiros 12 meses estás isento(a) de contribuições.","Depois, declaras o que recebeste em janeiro, abril, julho e outubro na Segurança Social Direta."],x:"Se acumulares com um emprego por conta de outrem, em certas condições ficas isento(a) de contribuições como independente. Confirma antes de pagar.",u:"https://www.seg-social.pt/"},
empresa:{t:"Criar empresa na hora",e:"IRN",w:1,c:360,l:"Identificação, capital social, contabilista certificado",h:["Escolhe um nome da bolsa de firmas pré-aprovadas ou pede certificado de admissibilidade.","Vai a um balcão Empresa na Hora ou faz online.","Define o capital social (mínimo 1 € por sócio).","Sais com certidão permanente e número de pessoa coletiva (NIPC)."],x:"Não precisas de 5.000 € de capital social: o mínimo é 1 € por sócio. Mas um capital simbólico passa má imagem a bancos e fornecedores.",i:"A empresa tem contabilidade organizada obrigatória: contabilista todos os meses.",u:"https://justica.gov.pt/"},
rcbe:{t:"Declarar o Beneficiário Efetivo (RCBE)",e:"IRN",w:0,c:0,h:["Até 30 dias depois de criares a empresa, entra no portal do RCBE.","Declara quem controla a empresa e autentica-te com a Chave Móvel Digital.","Atualiza sempre que mudarem sócios ou gerentes."],x:"É obrigatório e muita gente esquece. Sem ele há coimas e bancos que bloqueiam operações.",u:"https://rcbe.justica.gov.pt/"},
contabilista:{t:"Contratar contabilista certificado",e:"OCC",w:1,c:0,cm:150,h:["Procura um contabilista inscrito na Ordem dos Contabilistas Certificados.","Pede proposta com preço mensal fechado.","Ele trata do IVA, salários, IRC e IES."],x:"Como gerente da tua própria empresa podes ter de descontar para a Segurança Social mesmo com salário baixo. Pergunta antes de definires quanto te pagas.",u:"https://www.occ.pt/"},
licenca:{t:"Licenças da atividade e do espaço",e:"LOCAL",w:6,c:[0,500],h:["Vê no ePortugal se a tua atividade precisa de licença (restauração, alojamento, saúde, comércio).","Faz a comunicação prévia ou o pedido de licença online.","Antes de arrendar um espaço, confirma a licença de utilização na câmara."],x:"Arrendar um espaço cuja licença de utilização não permite a tua atividade é um erro caro e muito comum.",u:"https://eportugal.gov.pt/"},
seguros:{t:"Seguros obrigatórios",e:"SEG",w:1,c:0,cm:25,h:["Se contratares alguém, o seguro de acidentes de trabalho é obrigatório.","Algumas atividades exigem seguro de responsabilidade civil.","Compara propostas e lê as exclusões."],x:"Como trabalhador(a) independente, também precisas, em regra, de seguro de acidentes de trabalho para ti.",u:"https://www.asf.com.pt/"},
marca:{t:"Proteger o nome e a marca",e:"INPI",w:2,c:[100,200],h:["Pesquisa no INPI se o nome já está registado.","Regista a marca online nas classes do teu negócio.","Regista o domínio .pt."],x:"O nome da empresa não protege a marca. São registos diferentes.",u:"https://inpi.justica.gov.pt/"},
obrigacoes:{t:"Calendário fiscal do primeiro ano",e:"AT",w:0,c:0,h:["Guarda todas as faturas de despesas do negócio.","Põe alertas para IVA, Segurança Social e IRS (ou IRC e IES).","Separa a conta pessoal da do negócio."],x:"O primeiro ano a conta própria costuma trazer uma surpresa no IRS do ano seguinte. Guarda 20 a 25% de cada pagamento.",u:"https://www.portaldasfinancas.gov.pt/"},
// ---- Casa
orcamento:{t:"Saber quanto podes pagar",e:"TU",w:1,c:0,h:["Soma o rendimento líquido mensal do agregado.","Junta todas as prestações que já pagas.","Simula a nova prestação com a taxa a subir 1 a 2 pontos."],x:"O Banco de Portugal limita, em regra, a soma das prestações a 50% do rendimento. Os bancos usam essa conta para decidir.",u:"https://clientebancario.bportugal.pt/"},
simular:{t:"Simular crédito em vários bancos",e:"BANCO",w:3,c:0,h:["Pede simulação em pelo menos 3 bancos.","Compara a TAEG e não só a prestação.","Pede a Ficha de Informação Normalizada (FINE) de cada um."],x:"Podes negociar o spread. Um intermediário de crédito registado no Banco de Portugal compara por ti.",u:"https://clientebancario.bportugal.pt/"},
garantia:{t:"Garantia pública para jovens",e:"BANCO",w:2,c:0,h:["Até aos 35 anos, na primeira habitação, pede ao banco a garantia pública.","O Estado garante parte da entrada, até permitir financiar 100%.","Cumpres limites de valor da casa e rendimento."],x:"Os bancos não são obrigados a aceitar todos os pedidos. Pergunta logo na primeira simulação.",u:"https://clientebancario.bportugal.pt/"},
cpcv:{t:"Contrato-promessa e sinal",e:"NOT",w:2,c:[0,300],h:["Assinas o contrato-promessa de compra e venda com o vendedor.","Pagas o sinal combinado.","Pede reconhecimento das assinaturas."],x:"Se desistires, perdes o sinal. Se for o vendedor a desistir, devolve-o em dobro.",u:"https://justica.gov.pt/"},
avaliacao:{t:"Avaliação bancária",e:"BANCO",w:2,c:[230,350],h:["O banco manda um perito avaliar a casa.","O crédito é calculado sobre o valor mais baixo entre a avaliação e o preço."],x:"Se a avaliação vier abaixo do preço, a diferença sai do teu bolso.",u:"https://clientebancario.bportugal.pt/"},
imtjovem:{t:"Isenção jovem de IMT e Imposto do Selo",e:"AT",w:0,c:0,h:["Até aos 35 anos, na primeira habitação própria e permanente.","O valor da casa tem de estar dentro do limite.","Declara nas Finanças antes da escritura."],x:"Tens de fazer daquela casa a tua morada fiscal dentro do prazo, senão perdes a isenção.",u:"https://www.portaldasfinancas.gov.pt/"},
imt:{t:"Pagar IMT e Imposto do Selo",e:"AT",w:0,c:[0,15000],h:["Gera a guia de IMT no Portal das Finanças antes da escritura.","Paga o Imposto do Selo (0,8% do valor).","Leva os comprovativos à escritura."],x:"Para casas baratas de habitação própria, o IMT pode ser zero. Simula no Portal antes de negociar o preço.",u:"https://www.portaldasfinancas.gov.pt/"},
escritura:{t:"Escritura e registo (Casa Pronta)",e:"IRN",w:3,c:[700,1000],h:["Marca no balcão Casa Pronta de uma Conservatória.","Escritura e registo da casa fazem-se no mesmo sítio.","Sais com a casa registada em teu nome."],x:"No Casa Pronta, tudo se trata num só balcão, normalmente mais barato do que notário e registo à parte.",u:"https://justica.gov.pt/"},
seguroscasa:{t:"Seguros de vida e multirriscos",e:"SEG",w:1,c:0,cm:40,h:["O banco exige seguro de vida e multirriscos.","Pede propostas a outras seguradoras.","Apresenta-as ao banco."],x:"Não és obrigado(a) a fazer os seguros no banco que te dá o crédito. Fora, costumam ser mais baratos.",u:"https://www.asf.com.pt/"},
imi:{t:"IMI todos os anos",e:"AT",w:0,c:0,h:["As Finanças enviam a nota de cobrança do IMI.","Paga em 1, 2 ou 3 prestações conforme o valor."],x:"Habitação própria e permanente pode ter isenção de IMI durante 3 anos, dentro de limites de valor e rendimento.",u:"https://www.portaldasfinancas.gov.pt/"},
procurar:{t:"Procurar casa sem cair em esquemas",e:"TU",w:6,c:0,h:["Visita sempre antes de pagar qualquer valor.","Pede o nome do senhorio e confirma que é o dono.","Desconfia de rendas muito abaixo do mercado."],x:"Por lei, a caução não pode passar de 2 rendas, e o adiantamento de rendas também tem limite de 2."},
arrendar:{t:"Contrato legal de arrendamento",e:"AT",w:1,c:0,h:["Exige contrato escrito com prazo, renda e caução.","O senhorio tem de o comunicar às Finanças.","Pede recibos de renda eletrónicos todos os meses."],x:"Com recibos eletrónicos, a renda desconta no teu IRS. Sem eles, perdes esse dinheiro.",u:"https://www.portaldasfinancas.gov.pt/"},
porta65:{t:"Porta 65 Jovem",e:"LOCAL",w:6,c:0,h:["Para quem tem entre 18 e 35 anos.","Candidatura online no Portal da Habitação.","Recebes parte da renda paga pelo IHRU."],l:"Contrato registado, IRS, NIF",x:"As candidaturas abrem em períodos específicos. Prepara os documentos antes.",u:"https://www.portaldahabitacao.pt/"},
apoiorenda:{t:"Apoio extraordinário à renda",e:"SS",w:0,c:0,h:["Não precisas de te candidatar: é automático.","Aplica-se se a renda pesar mais de 35% do rendimento, dentro de limites.","O contrato tem de estar nas Finanças."],x:"Muita gente tem direito e não sabe. Vê na Segurança Social Direta se aparece o pagamento.",u:"https://www.portaldahabitacao.pt/"},
// ---- Família
gravidez:{t:"Vigilância da gravidez no SNS",e:"SNS",w:36,c:0,h:["Marca consulta no centro de saúde assim que souberes.","As consultas e exames de rotina da gravidez são gratuitos.","Pede declaração para o trabalho em cada consulta."],x:"Tens direito a dispensa do trabalho para consultas pré-natais, sem perder salário.",u:"https://www.sns24.gov.pt/"},
prenatal:{t:"Abono pré-natal",e:"SS",w:1,c:0,h:["A partir da 13.ª semana de gravidez.","Pede na Segurança Social Direta.","Junta a declaração médica com o tempo de gravidez."],x:"Muita gente não sabe que pode receber abono ainda durante a gravidez.",u:"https://www.seg-social.pt/"},
nascercidadao:{t:"Registar o bebé (Nascer Cidadão)",e:"IRN",w:0,c:0,h:["Na maternidade, logo após o parto.","Fica feito o registo, o NIF, o NISS e o número de utente.","Se não der lá, tens 20 dias para registar numa Conservatória."],l:"Identificação dos pais",x:"Faz tudo de uma vez na maternidade: poupa várias idas a balcões.",u:"https://justica.gov.pt/"},
licencaparental:{t:"Licença parental",e:"SS",w:1,c:0,h:["Avisa a entidade patronal com antecedência.","Pede o subsídio parental na Segurança Social Direta.","Decide como dividem os dias entre os dois."],x:"O pai tem dias de licença obrigatórios. E se partilharem a licença, ganham dias extra pagos.",u:"https://www.seg-social.pt/"},
abono:{t:"Abono de família",e:"SS",w:1,c:0,h:["Pede na Segurança Social Direta depois do registo.","O valor depende do escalão de rendimentos.","Prova os rendimentos quando pedirem."],u:"https://www.seg-social.pt/",x:"O escalão é revisto. Se o rendimento do agregado baixar, pede reavaliação."},
creche:{t:"Vaga na Creche Feliz",e:"SS",w:8,c:0,h:["Procura creches aderentes perto de casa ou do trabalho.","Inscreve diretamente na creche, de preferência durante a gravidez.","A frequência é gratuita."],x:"As vagas acabam cedo. Inscrever ainda na gravidez faz diferença.",u:"https://www.seg-social.pt/"},
adocao:{t:"Candidatura à adoção",e:"SS",w:52,c:0,h:["Começa nos serviços de adoção da Segurança Social.","Sessão de informação, avaliação e formação.","Depois da aprovação, esperas por uma proposta compatível."],x:"A licença parental também se aplica a quem adota.",u:"https://www.seg-social.pt/"},
dependentes:{t:"Dependentes no IRS",e:"AT",w:0,c:0,h:["Atualiza o agregado familiar no Portal das Finanças.","Pede fatura com o NIF da criança.","Saúde e educação da criança descontam no IRS."],x:"A dedução por dependente é maior até aos 6 anos.",u:"https://www.portaldasfinancas.gov.pt/"},
casamento:{t:"Processo de casamento",e:"IRN",w:6,c:[120,300],h:["Abres o processo preliminar numa Conservatória ou online.","Escolhem o regime de bens.","Marcam data e local."],x:"Sem convenção antenupcial, o regime é comunhão de adquiridos. Pensem nisso se um tiver negócio ou dívidas.",u:"https://justica.gov.pt/"},
uniaofacto:{t:"Comprovar a união de facto",e:"LOCAL",w:1,c:0,h:["Pede declaração na Junta de Freguesia da morada comum.","Assinam declaração sob compromisso de honra."],x:"Para IRS conjunto contam 2 anos de vida em comum.",u:"https://eportugal.gov.pt/"},
// ---- Saúde e futuro
medico:{t:"Consulta de rotina",e:"SNS",w:2,c:0,h:["Marca com o médico de família no centro de saúde ou pelo SNS 24.","Pede análises de rotina."],u:"https://www.sns24.gov.pt/"},
psicologo:{t:"Acompanhamento psicológico",e:"SNS",w:4,c:0,h:["No SNS, pede ao médico de família consulta de psicologia.","Em privado, confirma a cédula na Ordem dos Psicólogos.","A linha SNS 24 também tem aconselhamento psicológico."],x:"Consultas de psicologia têm IVA isento e entram nas despesas de saúde do IRS.",u:"https://www.ordemdospsicologos.pt/"},
sns24:{t:"Linha SNS 24",e:"SNS",w:0,c:0,h:["Liga 808 24 24 24, a qualquer hora.","Fazem triagem e encaminham.","Há aconselhamento psicológico."],u:"https://www.sns24.gov.pt/"},
irs:{t:"Entregar o IRS",e:"AT",w:1,c:0,h:["Valida as faturas no e-fatura até ao fim de fevereiro.","Entre 1 de abril e 30 de junho, entra no Portal das Finanças.","Simula sozinho(a) e em conjunto, se puderes, e entrega a melhor."],x:"O IRS é progressivo: ganhar mais nunca faz receber menos, só a parte acima de cada escalão paga mais.",u:"https://www.portaldasfinancas.gov.pt/"},
efatura:{t:"Validar faturas no e-fatura",e:"AT",w:0,c:0,h:["Pede fatura com NIF em tudo.","Entra no e-fatura e classifica as faturas pendentes.","Faz isso até ao fim de fevereiro."],x:"Faturas por classificar podem não contar para as deduções.",u:"https://faturas.portaldasfinancas.gov.pt/"},
coima:{t:"Regularizar o IRS em atraso",e:"AT",w:1,c:[0,200],h:["Entrega a declaração em falta.","Se for antes de seres notificado(a), a coima é reduzida."],u:"https://www.portaldasfinancas.gov.pt/"},
apoioat:{t:"Pedir ajuda às Finanças",e:"AT",w:1,c:0,h:["Marca atendimento num Serviço de Finanças.","Ou usa o e-balcão no Portal."],u:"https://www.portaldasfinancas.gov.pt/"},
ehic:{t:"Cartão Europeu de Seguro de Doença",e:"SS",w:1,c:0,h:["Pede na Segurança Social Direta.","Chega por correio."],x:"Cobre estadias temporárias. Se fores viver para outro país, tens de te inscrever no sistema de saúde de lá.",u:"https://www.seg-social.pt/"},
moradafiscal:{t:"Mudar a morada fiscal para o estrangeiro",e:"AT",w:1,c:0,h:["Atualiza a morada no Portal das Finanças ou Cartão de Cidadão.","Fora da UE, podes ter de nomear um representante fiscal.","Declara no IRS o ano de saída."],x:"Se fores viver fora e não mudares a morada, Portugal pode continuar a tratar-te como residente para IRS.",u:"https://www.portaldasfinancas.gov.pt/"},
consular:{t:"Inscrição consular",e:"CONS",w:1,c:0,h:["Inscreve-te no consulado português do país onde vais viver.","Ficas com acesso a documentos e apoio no estrangeiro."],u:"https://portaldascomunidades.mne.gov.pt/"},
regressar:{t:"Regressar a Portugal",e:"AT",w:2,c:0,h:["Atualiza a morada fiscal para Portugal.","Inscreve-te no centro de saúde.","Vê os apoios em vigor para quem regressa."],x:"Já houve um regime fiscal que reduzia o IRS de ex-emigrantes (Programa Regressar). Confirma se ainda se aplica quando voltares.",u:"https://www.portaldascomunidades.mne.gov.pt/"},
pla:{t:"Aprender português (PLA)",e:"IEFP",w:24,c:0,h:["Procura cursos de Português Língua de Acolhimento no IEFP ou escolas.","São gratuitos e dão certificado.","Faz o nível que precisas (A2 e acima)."],x:"O certificado de português A2 é um dos requisitos para pedir a nacionalidade.",u:"https://www.iefp.pt/"},
nacionalidade:{t:"Pedir a nacionalidade",e:"IRN",w:52,c:250,h:["Confirma os anos de residência legal exigidos agora.","Junta registo criminal, prova de português e de residência.","Pede no IRN, online ou presencialmente."],x:"As regras e prazos da nacionalidade foram alterados recentemente. Confirma no IRN antes de contar os anos.",u:"https://justica.gov.pt/"},
aforro:{t:"Certificados de Aforro",e:"BANCO",w:0,c:0,h:["Abre conta aforro nos CTT ou no AforroNet.","Subscreves a partir de valores baixos.","Podes resgatar depois do prazo mínimo."],x:"Poupança garantida pelo Estado, boa para fundo de emergência.",u:"https://www.igcp.pt/"},
ppr:{t:"Abrir um PPR",e:"BANCO",w:1,c:0,h:["Compara comissões e rendibilidade em bancos e seguradoras.","Define uma transferência automática mensal.","Guarda os comprovativos para o IRS."],x:"Parte do que pões num PPR desconta no IRS, com um limite que baixa com a idade.",u:"https://clientebancario.bportugal.pt/"},
renegociar:{t:"Rever créditos e comissões",e:"BANCO",w:1,c:0,h:["Lista todas as comissões que pagas.","Compara no Portal do Cliente Bancário.","Negoceia ou muda de banco."],u:"https://clientebancario.bportugal.pt/"},
carreira:{t:"Verificar a carreira contributiva",e:"SS",w:0,c:0,h:["Entra na Segurança Social Direta.","Vê ano a ano o que foi descontado.","Se faltarem anos, pergunta se podes regularizar."],x:"Anos em que trabalhaste sem descontos não contam para a reforma. Descobrir isso aos 60 é tarde demais.",u:"https://www.seg-social.pt/"},
simpensao:{t:"Simular a pensão",e:"SS",w:0,c:0,h:["Usa o simulador da Segurança Social Direta.","Vê o valor à idade normal, antes e depois.","Repete de ano a ano."],x:"Reformar antes da idade normal tem cortes permanentes. Trabalhar para lá dela aumenta a pensão.",u:"https://www.seg-social.pt/"},
pensao:{t:"Pedir a pensão de velhice",e:"SS",w:12,c:0,h:["Pede na Segurança Social Direta, a partir da idade de reforma aplicável.","Junta os períodos de trabalho noutros países, se tiveres.","Recebes a decisão e o primeiro pagamento."],x:"Os anos de trabalho noutros países da UE somam-se para a reforma.",u:"https://www.seg-social.pt/"},
cuidador:{t:"Estatuto do Cuidador Informal",e:"SS",w:8,c:0,h:["Pede na Segurança Social Direta ou num balcão.","Junta informação de saúde da pessoa cuidada.","Ficas com acesso a descanso do cuidador e apoio psicossocial."],x:"Em certas condições há um subsídio para o cuidador principal.",u:"https://www.seg-social.pt/"},
cartasocial:{t:"Encontrar apoio para idosos",e:"SS",w:4,c:0,h:["Pesquisa na Carta Social por concelho.","Contacta lares, centros de dia ou apoio domiciliário.","Pergunta por listas de espera e comparticipações."],u:"https://www.cartasocial.pt/"},
