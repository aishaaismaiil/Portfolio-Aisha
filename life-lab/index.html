document.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.id==="tmAiBack"){TMS.ai=0;tmSave();render();e.stopImmediatePropagation()}},true);

// ================= Moldura e render =================
function chrome(){
  const nav=TABS.map(k=>`<button data-tab="${k}" aria-current="${U.tab===k||(k==="simular"&&U.tab==="viver")?"page":"false"}">${icon(k)}<span>${u("tab_"+k)}</span></button>`).join("");
  const nd=DOCK.filter(k=>P.docs[k]).length;
  $("#side").innerHTML=`<div class="brand"><span class="mark" aria-hidden="true"></span><span>LifeLab</span></div>
   <nav class="snav">${nav}</nav>
   <button class="about" data-intro="1">${icon("info")}<span>${u("in_open")}</span></button>
   <div class="side-foot"><button class="me-card" data-sheet="1"><span class="pin sm">${P.age}</span><span class="me-t"><b>${esc(P.name||u("you"))}</b><small>${lbl("work",P.work)} · ${nd}/${DOCK.length} ${u("docs_n")}</small></span><span class="edit">${u("edit")}</span></button>${langSwitch()}<p class="note">${u("disclaimer")}</p></div>`;
  $("#mtop").innerHTML=`<div class="brand"><span class="mark" aria-hidden="true"></span><span>LifeLab</span></div><div class="mtop-r"><button class="ibtn" data-intro="1" aria-label="${esc(u("in_open"))}">${icon("info")}</button>${langSwitch()}<button class="me-btn" data-sheet="1" aria-label="${u("edit_profile")}"><span class="pin sm">${P.age}</span></button></div>`;
  $("#mnav").innerHTML=TABS.map(k=>`<button data-tab="${k}" aria-current="${U.tab===k||(k==="simular"&&U.tab==="viver")?"page":"false"}">${icon(k)}<span>${u("nav_"+k)}</span></button>`).join("");
}
function render(){
  if(typeof document==="undefined")return;
  if(document.documentElement)document.documentElement.lang=LANG==="pt"?"pt-PT":LANG;
  chrome();
  const v={simular:vSimular,planear:vPlanear,comparar:vComparar,custos:vCustos,viver:vViver,mitos:vMitos,guia:vGuia}[U.tab]||vSimular;
  $("#view").innerHTML=v()+`<p class="note foot m-only">${u("disclaimer")}</p>`;
  sheet();intro();save();
}
function toTop(){try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){try{window.scrollTo(0,0)}catch(_){}}}

// ================= Eventos =================
document.addEventListener("click",e=>{
  if(e.target.id==="sheetBg"){sheetOpen=false;render();return}
  if(e.target.id==="introBg"){closeIntro();return}
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.lang){LANG=d.lang;store("ll_lang",LANG);render();return}
  if(d.val){const i=P.vals.indexOf(d.val);if(i>=0)P.vals.splice(i,1);else if(P.vals.length<3)P.vals.push(d.val);else{P.vals.pop();P.vals.push(d.val)}render();return}
  if(d.cusize){U.cu.size=d.cusize;render();return}
  if(d.curm!==undefined){U.cu.cities.splice(+d.curm,1);render();return}
  if(d.curm2!==undefined){U.cu.ctry.splice(+d.curm2,1);render();return}
  if(b.id==="cuAddCity"){const n=Object.keys(RENT).find(x=>!U.cu.cities.includes(x));if(n)U.cu.cities.push(n);render();return}
  if(b.id==="cuAddCtry"){const n=Object.keys(PLI).find(x=>x!=="PT"&&!U.cu.ctry.includes(x));if(n)U.cu.ctry.push(n);render();return}
  if(d.intro){introOpen=true;intro();return}
  if(b.id==="introClose"||b.id==="introGo"){closeIntro();return}
  if(d.introgo!==undefined){introOpen=false;store("ll_intro_seen",1);if(d.introgoal){U.goal=d.introgoal;U.tab="planear"}else U.tab=d.introgo;render();toTop();return}
  if(d.sheet){sheetOpen=true;sheet();return}
  if(b.id==="sheetClose"||b.id==="sheetDone"){sheetOpen=false;render();return}
  if(d.tab){U.tab=d.tab;render();toTop();return}
  if(d.goal!==undefined){U.goal=d.goal||null;if(d.fromcmp!==undefined)U.forks[d.goal]=Object.assign({},U.cmp[+d.fromcmp].f);U.tab="planear";render();toTop();return}
  if(d.fork){U.forks[U.goal]=Object.assign({},U.forks[U.goal]||{},{[d.fork]:d.v});render();return}
  if(d.open){U.open[d.open]=!U.open[d.open];render();return}
  if(d.act){const id=d.act;if(d.k==="none")delete U.acts[id];else U.acts[id]=Object.assign({},U.acts[id]||{},{k:d.k});render();if(d.k==="alt"){const t=document.getElementById("alt-"+id);if(t&&t.focus)t.focus()}return}
  if(b.id==="futGo"){futRun(U.goal);return}
  if(b.id==="futStop"){FBUSY&&FBUSY.ctl.abort();return}
  if(b.id==="wiGo"){wiRun(U.goal);return}
  if(d.wirm!==undefined){const f=U.fut[U.goal];if(f&&f.wi){f.wi.splice(+d.wirm,1);save();render()}return}
  if(d.bag!==undefined){U.bag[d.bag]=!U.bag[d.bag];render();return}
  if(d.help){helpRun(d.help,d.kind);return}
  if(d.hstop){const s=HELP[d.hstop];s&&s.ctl&&s.ctl.abort();return}
  if(d.copy){const s=HELP[d.copy];if(!s)return;const ok=()=>{b.textContent=u("copied")+" ✓";setTimeout(()=>{b.textContent=u("copy")},1600)};
    const sel=()=>{const el=document.getElementById("hout-"+d.copy);if(el){const r=document.createRange();r.selectNodeContents(el);const w=window.getSelection();w.removeAllRanges();w.addRange(r);b.textContent=u("selected")}};
    try{navigator.clipboard.writeText(s.text).then(ok,sel)}catch(_){sel()}return}
  if(d.addcmp){const f=forksOf(d.addcmp);U.cmp=[{g:d.addcmp,f}].concat(U.cmp.filter(c=>!(c.g===d.addcmp&&JSON.stringify(c.f)===JSON.stringify(f)))).slice(0,3);if(U.cmp.length<2)U.cmp.push({g:d.addcmp==="carreira"?"negocio":"carreira",f:{}});U.tab="comparar";render();toTop();return}
  if(b.id==="addCol"){U.cmp.push({g:(G.find(g=>!U.cmp.some(c=>c.g===g.id))||G[0]).id,f:{}});render();return}
  if(d.rmcol!==undefined){U.cmp.splice(+d.rmcol,1);render();return}
  if(d.colf!==undefined){const c=U.cmp[+d.colf];c.f=Object.assign({},c.f,{[d.fk]:d.v});render();return}
  if(d.simgoal){TMS.gid=d.simgoal;TMS.ai=0;tmSave();U.tab="simular";render();toTop();return}
  if(d.tpl){SD.ideia=d.tpl;render();return}
  if(b.id==="simGo"){simStart();return}
  if(b.id==="simStep"){simStep();return}
  if(b.id==="simStop"){BUSY&&BUSY.ctl.abort();return}
  if(d.pick!==undefined){SD.pick=+d.pick;SD.custom="";render();return}
  if(d.jump!==undefined){SD.jump=+d.jump;render();return}
  if(b.id==="simUndo"){const t=SIM.branches[SIM.active].turns;if(t.length>1)t.pop();SD.pick=null;store("ll3_sim",SIM);render();return}
  if(b.id==="simNew"){SIM=null;BCMP=false;store("ll3_sim",null);render();toTop();return}
  if(d.branch!==undefined){const i=+d.branch,src=SIM.branches[SIM.active];SIM.branches.push({nome:SIM.branches.length+1,orig:i,par:SIM.active,turns:JSON.parse(JSON.stringify(src.turns.slice(0,i+1)))});SIM.active=SIM.branches.length-1;SD.pick=null;SD.custom="";store("ll3_sim",SIM);render();const n=document.querySelector(".tn.cur");if(n&&n.scrollIntoView)try{n.scrollIntoView({behavior:"smooth",block:"start"})}catch(_){}return}
  if(d.br!==undefined){SIM.active=+d.br;BCMP=false;SD.pick=null;store("ll3_sim",SIM);render();toTop();return}
  if(b.id==="bcmp"){BCMP=true;render();toTop();return}
  if(b.id==="bcmpClose"){BCMP=false;render();return}
  if(b.id==="vStart"||b.id==="vReset"){vNew();U.tab="viver";render();toTop();return}
  if(d.vc!==undefined){vChoose(+d.vc);return}
  if(b.id==="vNext"){vNext();return}
  if(b.id==="vBack"){vBack();return}
  if(d.qa!==undefined){U.quiz.a[Math.min(U.quiz.i,Q.length-1)]=d.qa==="1";render();return}
  if(d.qn){U.quiz.i++;render();return}
  if(d.qp){U.quiz.i--;render();return}
  if(d.qr){U.quiz={i:0,a:{}};render();return}
  if(d.gent){U.gent=d.gent;render();return}
  if(d.pk){P[d.pk]=d.v;render();return}
  if(d.doc){P.docs[d.doc]=!P.docs[d.doc];render();return}
  if(d.par){P.parceiro=!P.parceiro;render();return}
  if(d.kid){P.filhos=Math.max(0,Math.min(8,P.filhos+ +d.kid));render();return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="simIdeia"){SD.ideia=t.value;const g=$("#simGo");if(g)g.disabled=!(SD.ideia.trim()&&sampleState==="ok");save();return}
  if(t.id==="simDet"){SD.det=t.value;save();return}
  if(t.id==="simCustom"){SD.custom=t.value;document.querySelectorAll("#simStep").forEach(g=>g.disabled=!(SD.custom.trim()||SD.pick!=null));document.querySelectorAll(".opt3").forEach(o=>o.setAttribute("aria-pressed",SD.custom.trim()?"false":String(+o.dataset.pick===SD.pick)));save();return}
  if(t.dataset&&t.dataset.alttxt){const a=U.acts[t.dataset.alttxt];if(a){a.txt=t.value.slice(0,400);save()}return}
  if(t.dataset&&t.dataset.altval){const a=U.acts[t.dataset.altval];if(a){a.val=t.value===""?null:Math.max(0,Number(t.value)||0);save()}return}
  if(t.dataset&&t.dataset.num&&U.goal){const n=U.nums[U.goal]=U.nums[U.goal]||{};n[t.dataset.num]=t.dataset.num==="note"?t.value.slice(0,400):(t.value===""?null:Math.max(0,Number(t.value)||0));save();return}
  if(t.dataset&&t.dataset.cu){U.cu[t.dataset.cu]=Math.max(0,Number(t.value)||0);save();return}
  if(t.id==="gq"){U.gq=t.value;$("#glist").innerHTML=guideItems();save();return}
  if(t.id==="pName"){P.name=t.value;save();return}
  if(t.id==="pAge"){P.age=+t.value;$("#pAgeOut").textContent=P.age;save();return}
  if(t.id==="pPou"){P.pou=+t.value;$("#pPouOut").textContent=eur(P.pou);save();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.cucity!==undefined){U.cu.cities[+t.dataset.cucity]=t.value;render();return}
  if(t.dataset&&t.dataset.cuctry!==undefined){U.cu.ctry[+t.dataset.cuctry]=t.value;render();return}
  if(t.id==="pCountry"){P.country=t.value;render();return}
  if(t.id==="pAiLang"){P.ailang=t.value;render();return}
  if(t.dataset&&t.dataset.cu){render();return}
  if(t.dataset&&t.dataset.colg!==undefined){U.cmp[+t.dataset.colg]={g:t.value,f:{}};render();return}
  if(t.id==="pAge"||t.id==="pPou"||t.id==="pName"){render();return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&introOpen){closeIntro();return}if(e.key==="Escape"&&sheetOpen){sheetOpen=false;render()}if(e.key==="Enter"&&e.target&&e.target.id==="wiq"){e.preventDefault();wiRun(U.goal)}});
render();

</script>
</body></html>
