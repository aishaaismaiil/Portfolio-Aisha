const S_EN={
cc:["Valid Citizen Card (Cartão de Cidadão)",["Book an appointment on ePortugal (or go without one and wait longer).","Go to a Loja do Cidadão, Espaço Cidadão or Registry Office.","They take your photo, fingerprints and signature at the desk.","You get the PIN codes by post and collect the card at the same place."],"Your old card","You can renew up to 6 months before it expires. Without a valid card you cannot activate the Digital Mobile Key or do almost anything online.",null],
registoue:["EU citizen registration certificate",["After 3 months in Portugal, go to the Town Hall (Câmara Municipal) where you live.","Ask for the EU citizen registration certificate.","Show your ID and proof of your situation: work, study or own means.","Keep the certificate: banks, health centres and landlords will ask for it."],"Passport or ID card, proof of address","Many EU citizens never ask for it and later cannot prove residence. After 5 years you can apply for permanent residence.",null],
visto:["Apply for the right visa at the consulate",["Choose the visa by purpose: work with a contract, study, qualified job-seeking, own income or remote work.","Book at the Portuguese consulate or visa centre in your country.","Gather criminal record, health insurance, proof of means and accommodation.","Once approved, enter Portugal within the visa's validity."],"Valid passport, criminal record, proof of means","The 'expression of interest' route (entering as a tourist and regularising later) has ended. Today the path almost always starts with a visa from your home country.",null],
aima:["Residence permit at AIMA",["Book your appointment at AIMA within the visa's validity.","Bring passport, visa, NIF, address and proof of purpose (contract, enrolment, income).","They take biometric data and you pay the fees.","The card arrives by post. Until then, keep the proof of your application."],"Passport, visa, NIF, proof of address and means","Waiting times are long: the appointment receipt proves your application is in progress. Bringing family over (family reunification) now generally requires 2 years of residence.","With the residence permit you can apply for NISS, a health number and the Digital Mobile Key."],
nif:["Get a tax number (NIF)",["Portuguese citizens already have a NIF linked to their Citizen Card.","Foreigners apply at a Tax Office (Serviço de Finanças) with passport and proof of address.","People living outside the EU may need a tax representative in Portugal."],"ID and proof of address","Some companies charge to get you a NIF. At the Tax Office it is free.",null],
iban:["Portuguese bank account",["Compare fees: there are free accounts for young people and basic bank accounts.","Bring ID, NIF and proof of address.","Open it at a branch or online by video call."],null,"You are entitled to a basic bank account (serviços mínimos bancários) with very low fees, even with little money.",null],
niss:["Get a Social Security number (NISS)",["If you have worked in Portugal, you can see your NISS on Segurança Social Direta.","Otherwise, apply online or at a Social Security office.","Foreigners apply at the desk with residence permit or proof of application and NIF."],null,"Without a NISS your employer cannot register you. Check Segurança Social Direta now and then to confirm your contributions are being paid.",null],
cmd:["Activate the Digital Mobile Key (CMD)",["Have your ID or residence card and your phone ready.","Activate it in the gov.pt app, online with a card reader, or at a Loja do Cidadão.","Choose a PIN; each login sends you a code by SMS."],null,"With it you log in to Finanças, Social Security and SNS 24, and sign documents digitally from home.",null],
utente:["Health number and family doctor",["Go to the health centre (centro de saúde or USF) for your area.","Bring ID, NIF and proof of address.","Ask to register and for a family doctor. If none is available, you go on a waiting list but can still get appointments."],null,"Before going to A&E, call SNS 24 (808 24 24 24): if they refer you, you avoid the user fee and wait less.",null],
carta:["Driving licence",["Enrol at a driving school (theory and driving lessons).","Take the theory test and then the driving test, booked by the school.","The licence is issued by IMT."],"ID, medical certificate, photo","If you hold a licence from outside the EU, there may be a deadline to exchange it after getting residence. After that, you may have to take the test.",null],
votar:["Know where you vote",["Voter registration is automatic, based on the address on your Citizen Card.","Check your polling station on the voter registration portal before each election."],null,"If you move and don't update your card address, you keep voting in your old parish.",null],
morada:["Update your address",["Change the address on your Citizen Card online with the Digital Mobile Key or at a desk.","Confirm the code you receive by post at the new address.","Your tax address updates with the card."],null,"Your address decides your health centre, your children's school, where you vote and which parish council issues certificates.",null],
exames:["Register for the national exams",["Check which entrance exams the course requires.","Register at your secondary school office within the deadlines.","The grades count towards your application average."],null,"You can retake exams to raise your entrance grade, even after finishing secondary school.",null],
candidatura:["Apply to higher education",["Request your application password on the DGES website.","In the 1st phase (summer) choose up to 6 course/institution pairs.","If you don't get in, the 2nd and 3rd phases offer the remaining places.","Once placed, you enrol at the institution."],null,"There are special quotas (islands, emigrants, disability) and special regimes many people don't know about.",null],
m23:["Over-23 admission (Maiores de 23)",["Check whether the institution has Over-23 places for your course.","Sign up for the institution's own tests (written and interview).","If you pass, you apply for that competition's places."],null,"From age 23 you can enter university without national exams or a secondary school average.",null],
mestrado:["Master's application",["Choose master's programmes and check each university's application phases.","Prepare CV, motivation letter and transcript.","Apply directly on the university's portal."],null,"Many universities have several phases; the last ones have fewer places but also less competition.",null],
ctesp:["Apply to a CTeSP course",["Choose a two-year higher technical course at a polytechnic.","Apply directly at the polytechnic.","It includes an internship in a company in the last semester."],null,"No national exams required. Afterwards you can continue to a degree with credit transfer.",null],
mooc:["Short online course",["Look for free courses from Portuguese institutions on the NAU platform.","Choose one with a certificate.","Add the certificate to your CV and LinkedIn."],null,"Short courses don't replace a degree, but they show initiative and help you test whether you like the field.",null],
bolsa:["Apply for a DGES grant",["Go to the DGES BeOn platform.","Fill it in with your household income.","Apply every academic year, within the deadlines."],"Household tax return and everyone's NIF","It includes a housing supplement if you study far from home. Applying late can cost you months of grant.",null],
te:["Working-student status",["Ask at the academic services office.","Hand in a statement from your employer.","Tell your employer your timetable and exam dates."],null,"You may miss work on the exam day and the day before without losing pay, and get adjusted hours.",null],
passe:["Public transport pass",["Apply with your local operator (in the Lisbon area, navegante).","Bring ID and, if you study, proof of enrolment."],null,"Higher education students up to age 23 get a free pass.",null],
erasmus:["Apply for Erasmus+",["Talk to your university's International Relations Office.","Applications open about a year in advance.","You sign a learning agreement with the courses you'll take abroad."],null,"Erasmus+ isn't only for studying: recent graduates can do an internship abroad up to 12 months after finishing.",null],
reconhecer:["Recognise a foreign degree",["Check on DGES which type of recognition you need (automatic, level or specific).","Apply at a public university or at DGES.","For regulated professions, also register with the professional order (Ordem)."],null,"For psychology, health, engineering or law, recognising the degree isn't enough: the professional order has its own requirements.",null],
iefp:["Register with IEFP (employment service)",["Create an account on IEFPonline or go to your local job centre.","Book a meeting with an advisor.","You get access to job offers, training and internships."],"ID, NISS, certificate of qualifications","Being registered opens the door to internships and support you won't find anywhere else.",null],
garantiajovem:["Youth Guarantee (Garantia Jovem)",["For people up to 29 who are not working or studying.","Register online.","You receive job, internship or training offers."],null,"It's one of the fastest routes to a paid internship.",null],
ces:["European Solidarity Corps",["Create a profile on the European Youth Portal (ages 18 to 30).","Apply for volunteering projects in another country.","Travel, accommodation and an allowance are included."],null,"It counts as international experience on your CV and it's paid.",null],
contrato:["Read the contract before signing",["Check contract type, salary, hours and place of work.","Check the probation period (usually 90 days; longer for a first job).","Always ask for a signed copy."],null,"During probation either side can end the contract without reason. After 60 days, notice is required.",null],
act:["Complaint to ACT (labour inspectorate)",["Gather payslips, contract and messages.","File the complaint online or in person at ACT.","Check your contributions on Segurança Social Direta."],null,"You can file a complaint without your employer learning your identity.",null],
estagio:["ATIVAR.PT internship",["Register with IEFP.","Look for internship offers on IEFPonline or ask a company to apply with you.","The internship is paid and has a supervisor."],null,"It's not only for recent graduates: there are conditions for career changers and older unemployed people.",null],
irsjovem:["Activate IRS Jovem (youth income tax relief)",["Up to age 35, part of your employment income is exempt from income tax for 10 years.","Ask your employer to apply it to your monthly withholding.","Confirm it in your annual tax return."],null,"Years with no income don't use up your 10 years of relief.",null],
eures:["Look for work in the EU (EURES)",["Search offers on the EURES portal.","Talk to a EURES advisor at IEFP.","Prepare a Europass CV."],null,"EURES advisors help with contracts, taxes and social security in the destination country.",null],
cv:["CV and LinkedIn for the new field",["List what you already do and translate it into the new field's language.","Put recent projects and training at the top.","Ask 2 people in the field to review it."],null,"Transferable skills (managing people, serving customers, organising) matter more than your old job title.",null],
rede:["Talk to people already there",["Find 5 to 10 people in the field you want.","Ask for 20 minutes to learn what their day is like.","Ask: what do you wish you'd known before?"],null,"Many jobs are filled by referral before they're advertised.",null],
qualifica:["Guidance at a Qualifica Centre",["Find the nearest Qualifica Centre.","Book a free assessment and guidance session.","You leave with a plan: training, certification or both."],null,"These centres are for adults of any age and are free.",null],
rvcc:["Certify what you already know (RVCC)",["At the Qualifica Centre, ask for an academic or professional RVCC process.","You build a portfolio from your experience.","You present it to a panel, which certifies your skills."],null,"Years of experience can earn you a 9th or 12th grade certificate, or a professional one, without going back to class.",null],
formacao:["Certified training",["Look at modular training and adult education courses (EFA).","Enrol at an IEFP training centre or certified provider.","Some include a grant and transport allowance."],null,"As an employee you are entitled to 40 hours of training a year paid by your employer.",null],
saida:["Leave your job safely",["Give the required notice (30 days up to 2 years of service, 60 days after).","Hand in your resignation in writing and keep a copy.","Ask for payment of proportional holidays and allowances."],null,"If you resign on your own initiative (without just cause), you are not entitled to unemployment benefit.","From here on your income depends only on the new path."],
paralelo:["Combine it with your current job",["Read your contract: look for exclusivity or non-compete clauses.","Don't use your employer's time, clients or equipment.","Set an exit point: for example, when new income covers 3 months of salary."],null,"Without an exclusivity clause you can have a side activity, as long as you don't compete with your employer.",null],
desemprego:["Claim unemployment benefit",["Ask your employer for the unemployment status declaration.","Register with IEFP.","Apply on Segurança Social Direta within 90 days of losing your job."],null,"After 90 days you lose days of benefit. Resigning on your own initiative gives no entitlement.",null],
validar:["Validate the idea before spending",["Talk to 15 to 20 potential customers before building anything.","Test a minimal version: a page, a sample, a service done by hand.","Work out how many sales per month you need to cover costs."],null,"Most businesses fail from lack of customers, not lack of paperwork. Validate first, register later.","If nobody pays, you've saved months and money."],
planonegocio:["Plan and a chat with an accountant",["Make a 12-month forecast: sales, fixed costs, variable costs.","Take it to a certified accountant and ask which legal form suits you best.","Decide how much you'll pay yourself and how much to keep for taxes."],null,"One hour with an accountant before you start can save you hundreds of euros in badly chosen taxes.",null],
montanteunico:["Get your unemployment benefit in one payment",["You must be receiving unemployment benefit and registered with IEFP.","Present your self-employment project to IEFP.","If approved, you receive the remaining payments at once, to invest."],null,"Few people know that unemployment benefit can be paid in advance, all at once, to start your own business.","You stop receiving monthly benefit; the money goes into the business."],
apoios:["Apply for public support",["Check open programmes at Startup Portugal and IEFP.","Talk to your town hall's entrepreneurship office or incubator.","Prepare budget, plan and documents in advance."],null,"Funding opens through calls with short deadlines. Those who already have a plan ready when the call opens are the ones who get it.",null],
microcredito:["Microcredit or bank loan",["Compare credit lines with mutual guarantee at several banks.","If the bank says no, microcredit exists for people with little access to credit.","Read the APR (TAEG) and the personal guarantees required."],null,"Many small-business loans require a personal guarantee: if the business closes, the debt is still yours.",null],
atividade:["Register as self-employed at Finanças",["Log in to the Portal das Finanças with the Digital Mobile Key.","Go to Services > Activity > Start and choose your activity code.","Choose the simplified regime and, if you invoice up to €15,000 a year, the VAT exemption.","Issue an invoice-receipt (fatura-recibo) on the Portal for each payment."],null,"Above €15,000 of turnover you move to the normal VAT regime the following year. Above €18,750 the change is immediate, on the invoice that crosses the limit.","From now on: quarterly declaration to Social Security and Annex B in your tax return."],
ssindep:["Social Security as self-employed",["Registration is automatic when you open your activity.","For the first 12 months you are exempt from contributions.","After that, declare what you earned in January, April, July and October on Segurança Social Direta."],null,"If you also have an employment contract, under certain conditions you are exempt as self-employed. Check before paying.",null],
empresa:["Create a company on the spot (Empresa na Hora)",["Choose a name from the pre-approved list or ask for a name certificate.","Go to an Empresa na Hora desk or do it online.","Set the share capital (minimum €1 per partner).","You leave with the permanent certificate and company tax number (NIPC)."],"ID, share capital, certified accountant","You don't need €5,000 of share capital: the minimum is €1 per partner. But a token capital looks bad to banks and suppliers.","The company must keep organised accounts: you'll need an accountant every month."],
rcbe:["Declare the Beneficial Owner (RCBE)",["Within 30 days of creating the company, go to the RCBE portal.","Declare who controls the company and log in with the Digital Mobile Key.","Update it whenever partners or managers change."],null,"It's mandatory and many people forget. Without it there are fines and banks that block operations.",null],
contabilista:["Hire a certified accountant",["Look for an accountant registered with the Order of Certified Accountants.","Ask for a fixed monthly price.","They handle VAT, payroll, corporate tax and the annual return (IES)."],null,"As manager of your own company you may have to pay Social Security even on a low salary. Ask before deciding how much to pay yourself.",null],
licenca:["Licences for the activity and the premises",["Check on ePortugal whether your activity needs a licence (food, lodging, health, retail).","Submit the prior notice or licence application online.","Before renting premises, confirm the usage licence with the town hall."],null,"Renting a space whose usage licence doesn't allow your activity is an expensive and very common mistake.",null],
seguros:["Mandatory insurance",["If you hire someone, workplace accident insurance is mandatory.","Some activities require liability insurance.","Compare quotes and read the exclusions."],null,"As a self-employed worker you generally also need workplace accident insurance for yourself.",null],
marca:["Protect your name and brand",["Search INPI to see whether the name is already registered.","Register the trademark online in your business's classes.","Register the .pt domain."],null,"Your company name doesn't protect your brand. They are separate registrations.",null],
obrigacoes:["First-year tax calendar",["Keep every business expense invoice.","Set reminders for VAT, Social Security and income tax (or corporate tax and IES).","Keep personal and business accounts separate."],null,"The first year working for yourself often brings a surprise in the next year's tax bill. Set aside 20 to 25% of every payment.",null],
orcamento:["Know how much you can pay",["Add up the household's net monthly income.","Add every loan instalment you already pay.","Simulate the new instalment with the rate 1 to 2 points higher."],null,"The Bank of Portugal generally limits total instalments to 50% of income. Banks use that figure to decide.",null],
simular:["Compare mortgages at several banks",["Ask for a simulation at at least 3 banks.","Compare the APR (TAEG), not just the instalment.","Ask for each bank's standard information sheet (FINE)."],null,"You can negotiate the spread. A credit intermediary registered with the Bank of Portugal compares for you.",null],
garantia:["Public guarantee for young people",["Up to age 35, for a first home, ask the bank for the public guarantee.","The State guarantees part of the down payment, allowing up to 100% financing.","Limits apply to the home's value and your income."],null,"Banks don't have to accept every request. Ask at the first simulation.",null],
cpcv:["Promissory contract and deposit",["You sign the promissory purchase contract with the seller.","You pay the agreed deposit.","Ask for the signatures to be certified."],null,"If you back out, you lose the deposit. If the seller backs out, they return it twice over.",null],
avaliacao:["Bank valuation",["The bank sends an expert to value the home.","The loan is based on the lower of the valuation and the price."],null,"If the valuation comes in below the price, you pay the difference.",null],
imtjovem:["Youth exemption from IMT and Stamp Duty",["Up to age 35, for a first permanent home.","The home's value must be within the limit.","Declare it at Finanças before the deed."],null,"You must make that home your tax address within the deadline, or you lose the exemption.",null],
imt:["Pay IMT and Stamp Duty",["Generate the IMT payment slip on the Portal das Finanças before the deed.","Pay Stamp Duty (0.8% of the value).","Bring the receipts to the deed."],null,"For cheaper homes for own residence, IMT can be zero. Simulate on the Portal before negotiating the price.",null],
escritura:["Deed and registration (Casa Pronta)",["Book at a Registry Office's Casa Pronta desk.","The deed and the property registration are done at the same place.","You leave with the home registered in your name."],null,"With Casa Pronta everything is handled at one desk, usually cheaper than a notary plus separate registration.",null],
seguroscasa:["Life and home insurance",["The bank requires life and home (multirriscos) insurance.","Ask other insurers for quotes.","Present them to the bank."],null,"You don't have to take out insurance with the bank lending you money. Outside, it's usually cheaper.",null],
imi:["Property tax (IMI) every year",["Finanças sends you the IMI bill.","Pay in 1, 2 or 3 instalments depending on the amount."],null,"A permanent own home may be exempt from IMI for 3 years, within value and income limits.",null],
procurar:["Find a home without falling for scams",["Always visit before paying anything.","Ask for the landlord's name and confirm they own it.","Be wary of rents far below market."],null,"By law the deposit can't exceed 2 months' rent, and advance rent is also limited to 2 months.",null],
arrendar:["A legal rental contract",["Demand a written contract with term, rent and deposit.","The landlord must report it to Finanças.","Ask for electronic rent receipts every month."],null,"With electronic receipts, rent is deductible on your income tax. Without them, you lose that money.",null],
porta65:["Porta 65 Jovem (rent support)",["For people aged 18 to 35.","Apply online on the Portal da Habitação.","Part of your rent is paid by IHRU."],"Registered contract, tax return, NIF","Applications open in specific periods. Prepare documents in advance.",null],
apoiorenda:["Extraordinary rent support",["You don't need to apply: it's automatic.","It applies if rent is more than 35% of income, within limits.","The contract must be registered at Finanças."],null,"Many people are entitled and don't know. Check Segurança Social Direta for the payment.",null],
gravidez:["Pregnancy care on the SNS",["Book an appointment at the health centre as soon as you know.","Routine pregnancy appointments and tests are free.","Ask for a statement for work at each appointment."],null,"You are entitled to time off work for prenatal appointments without losing pay.",null],
prenatal:["Prenatal child benefit",["From the 13th week of pregnancy.","Apply on Segurança Social Direta.","Attach the medical statement with the weeks of pregnancy."],null,"Many people don't know they can receive child benefit during pregnancy.",null],
nascercidadao:["Register the baby (Nascer Cidadão)",["At the maternity ward, right after the birth.","Registration, NIF, NISS and health number are done at once.","If not possible there, you have 20 days to register at a Registry Office."],"Parents' ID","Do it all at the maternity ward: it saves several trips to different offices.",null],
licencaparental:["Parental leave",["Tell your employer in advance.","Apply for parental benefit on Segurança Social Direta.","Decide how you'll split the days between you."],null,"Fathers have mandatory leave days. And if you share the leave, you get extra paid days.",null],
abono:["Child benefit (abono de família)",["Apply on Segurança Social Direta after registering the baby.","The amount depends on your income bracket.","Prove your income when asked."],null,"Your bracket is reviewed. If household income drops, ask for a reassessment.",null],
creche:["A place at Creche Feliz",["Look for participating nurseries near home or work.","Enrol directly at the nursery, ideally during pregnancy.","Attendance is free."],null,"Places run out early. Enrolling during pregnancy makes a difference.",null],
adocao:["Apply to adopt",["Start with Social Security's adoption services.","Information session, assessment and training.","After approval, you wait for a compatible match."],null,"Parental leave also applies to adoptive parents.",null],
dependentes:["Dependants on your tax return",["Update your household on the Portal das Finanças.","Ask for invoices with the child's NIF.","The child's health and education expenses are deductible."],null,"The deduction per dependant is higher up to age 6.",null],
casamento:["Marriage process",["Open the preliminary process at a Registry Office or online.","Choose the property regime.","Set the date and place."],null,"Without a prenuptial agreement, the regime is community of acquired property. Think about it if one of you has a business or debts.",null],
uniaofacto:["Prove a de facto union",["Ask for a statement at the parish council (Junta de Freguesia) of your shared address.","You both sign a statement on your honour."],null,"For a joint tax return, 2 years of living together are required.",null],
medico:["Routine check-up",["Book with your family doctor at the health centre or via SNS 24.","Ask for routine blood tests."],null,null,null],
psicologo:["Psychological support",["On the SNS, ask your family doctor for a psychology appointment.","Privately, check the psychologist's licence with the Order of Psychologists.","The SNS 24 line also offers psychological counselling."],null,"Psychology sessions are VAT-exempt and count as health expenses on your tax return.",null],
sns24:["SNS 24 line",["Call 808 24 24 24, any time.","They triage and refer you.","There is psychological counselling."],null,null,null],
irs:["File your income tax (IRS)",["Validate your invoices on e-fatura by the end of February.","Between 1 April and 30 June, log in to the Portal das Finanças.","Simulate filing alone and jointly, if you can, and submit the better one."],null,"Income tax is progressive: earning more never makes you take home less; only the part above each bracket pays more.",null],
efatura:["Validate invoices on e-fatura",["Ask for an invoice with your NIF for everything.","Log in to e-fatura and classify pending invoices.","Do it by the end of February."],null,"Unclassified invoices may not count towards deductions.",null],
coima:["Sort out a late tax return",["Submit the missing return.","If you do it before being notified, the fine is reduced."],null,null,null],
apoioat:["Ask Finanças for help",["Book an appointment at a Tax Office.","Or use the e-balcão on the Portal."],null,null,null],
ehic:["European Health Insurance Card",["Apply on Segurança Social Direta.","It arrives by post."],null,"It covers temporary stays. If you move to another country, you must register with that country's health system.",null],
moradafiscal:["Move your tax address abroad",["Update your address on the Portal das Finanças or Citizen Card.","Outside the EU, you may need to appoint a tax representative.","Declare the year you left in your tax return."],null,"If you live abroad and don't change your address, Portugal may keep treating you as a tax resident.",null],
consular:["Consular registration",["Register at the Portuguese consulate in the country you're moving to.","You get access to documents and support abroad."],null,null,null],
regressar:["Return to Portugal",["Update your tax address to Portugal.","Register at the health centre.","Check the support available for returnees."],null,"There used to be a tax regime that reduced income tax for returning emigrants (Programa Regressar). Check whether it still applies when you return.",null],
pla:["Learn Portuguese (PLA)",["Look for Portuguese as a Host Language courses at IEFP or schools.","They are free and give a certificate.","Take the level you need (A2 and above)."],null,"An A2 Portuguese certificate is one of the requirements to apply for nationality.",null],
nacionalidade:["Apply for nationality",["Check how many years of legal residence are currently required.","Gather criminal record, proof of Portuguese and of residence.","Apply at IRN, online or in person."],null,"Nationality rules and deadlines were changed recently. Check with IRN before counting the years.",null],
aforro:["Savings Certificates (Certificados de Aforro)",["Open a savings account at CTT post offices or on AforroNet.","You can subscribe from small amounts.","You can redeem after the minimum period."],null,"Savings guaranteed by the State, good for an emergency fund.",null],
ppr:["Open a retirement savings plan (PPR)",["Compare fees and returns at banks and insurers.","Set up an automatic monthly transfer.","Keep the receipts for your tax return."],null,"Part of what you put in a PPR is tax-deductible, with a limit that drops with age.",null],
renegociar:["Review loans and fees",["List every fee you pay.","Compare on the Bank Customer Portal.","Negotiate or switch banks."],null,null,null],
carreira:["Check your contribution record",["Log in to Segurança Social Direta.","See year by year what was paid.","If years are missing, ask whether you can regularise them."],null,"Years you worked without contributions don't count towards your pension. Finding out at 60 is too late.",null],
simpensao:["Simulate your pension",["Use the simulator on Segurança Social Direta.","See the amount at the normal age, before and after.","Repeat every year."],null,"Retiring before the normal age means permanent cuts. Working beyond it increases your pension.",null],
pensao:["Claim your old-age pension",["Apply on Segurança Social Direta from the applicable retirement age.","Add periods worked in other countries, if any.","You receive the decision and the first payment."],null,"Years worked in other EU countries add up towards your pension.",null],
cuidador:["Informal Carer Status",["Apply on Segurança Social Direta or at an office.","Attach health information about the person you care for.","You get access to respite care and psychosocial support."],null,"Under certain conditions there is an allowance for the main carer.",null],
cartasocial:["Find support for older people",["Search the Carta Social by municipality.","Contact care homes, day centres or home care services.","Ask about waiting lists and co-payments."],null,null,null],
voluntariado:["Find volunteering",["Ask your parish council or town hall about local volunteering.","Choose a cause and a schedule."],null,null,null],
rentev:["Living will",["Fill in the Advance Directive form.","Hand it in at the health centre with a certified signature.","It is recorded in RENTEV."],null,"You can name a healthcare proxy to decide for you if you can't.",null],
testamento:["Make a will",["Book with a notary.","Decide what you leave and to whom."],null,"Part of an estate must go to children and spouse (the 'legítima').",null]
};

const S_ES={
cc:["Tarjeta de ciudadano válida (Cartão de Cidadão)",["Pide cita en ePortugal (o ve sin cita y espera más).","Ve a una Loja do Cidadão, Espaço Cidadão o Registro Civil.","En el mostrador te hacen la foto, toman las huellas y la firma.","Recibes los códigos PIN por carta y recoges la tarjeta en el mismo sitio."],"La tarjeta antigua","Puedes renovarla hasta 6 meses antes de que caduque. Sin tarjeta válida no puedes activar la Clave Móvil Digital ni hacer casi nada en línea.",null],
registoue:["Certificado de registro de ciudadano de la UE",["Tras 3 meses en Portugal, ve al ayuntamiento (Câmara Municipal) donde vives.","Pide el certificado de registro de ciudadano de la UE.","Muestra tu identificación y prueba de tu situación: trabajo, estudios o medios propios.","Guarda el certificado: bancos, centros de salud y caseros te lo pedirán."],"Pasaporte o DNI, justificante de domicilio","Muchos ciudadanos europeos nunca lo piden y luego no pueden demostrar su residencia. A los 5 años puedes pedir la residencia permanente.",null],
visto:["Pedir el visado adecuado en el consulado",["Elige el visado según el motivo: trabajo con contrato, estudios, búsqueda de empleo cualificado, ingresos propios o teletrabajo.","Pide cita en el consulado o centro de visados de Portugal en tu país.","Reúne antecedentes penales, seguro médico, prueba de medios y alojamiento.","Una vez aprobado, entra en Portugal dentro de la validez del visado."],"Pasaporte válido, antecedentes penales, prueba de medios","La 'manifestación de interés' (entrar como turista y regularizarse después) se acabó. Hoy el camino casi siempre empieza con un visado pedido en tu país.",null],
aima:["Permiso de residencia en la AIMA",["Pide cita en la AIMA dentro de la validez del visado.","Lleva pasaporte, visado, NIF, domicilio y pruebas del motivo (contrato, matrícula, ingresos).","Toman los datos biométricos y pagas las tasas.","La tarjeta llega por correo. Mientras tanto, guarda el justificante del trámite."],"Pasaporte, visado, NIF, justificante de domicilio y de medios","Las esperas son largas: el justificante de la cita demuestra que tu trámite está en curso. Traer a la familia (reagrupación familiar) ahora exige, por norma, 2 años de residencia.","Con el permiso de residencia ya puedes pedir el NISS, el número de usuario de salud y la Clave Móvil Digital."],
nif:["Tener número fiscal (NIF)",["Los ciudadanos portugueses ya tienen NIF asociado a su Cartão de Cidadão.","Los extranjeros lo piden en una oficina de Hacienda (Serviço de Finanças) con pasaporte y justificante de domicilio.","Quien vive fuera de la UE puede necesitar un representante fiscal en Portugal."],"Identificación y justificante de domicilio","Hay empresas que cobran por tramitar el NIF. En Hacienda es gratis.",null],
iban:["Cuenta bancaria portuguesa",["Compara comisiones: hay cuentas gratuitas para jóvenes y cuentas de servicios mínimos.","Lleva identificación, NIF y justificante de domicilio.","Ábrela en una oficina o en línea por videollamada."],null,"Tienes derecho a una cuenta de servicios mínimos bancarios con comisiones muy bajas, aunque tengas poco dinero.",null],
niss:["Tener número de Seguridad Social (NISS)",["Si has trabajado en Portugal, ves tu NISS en la Segurança Social Direta.","Si no, pídelo en línea o en una oficina de la Seguridad Social.","Los extranjeros lo piden en el mostrador con permiso de residencia o justificante del trámite y NIF."],null,"Sin NISS la empresa no puede darte de alta. Revisa de vez en cuando en la Segurança Social Direta que te están cotizando.",null],
cmd:["Activar la Clave Móvil Digital (CMD)",["Ten a mano tu identificación o tarjeta de residencia y el móvil.","Actívala en la app gov.pt, en línea con lector de tarjetas o en una Loja do Cidadão.","Eliges un PIN; en cada acceso recibes un código por SMS."],null,"Con ella entras en Hacienda, Seguridad Social y SNS 24, y firmas documentos digitalmente sin salir de casa.",null],
utente:["Número de usuario de salud y médico de familia",["Ve al centro de salud (centro de saúde o USF) de tu zona.","Lleva identificación, NIF y justificante de domicilio.","Pide inscribirte y un médico de familia. Si no hay, quedas en lista de espera pero puedes tener consultas."],null,"Antes de ir a urgencias llama al SNS 24 (808 24 24 24): si te derivan, evitas la tasa y esperas menos.",null],
carta:["Carné de conducir",["Inscríbete en una autoescuela (clases teóricas y prácticas).","Haz el examen teórico y luego el práctico, que reserva la autoescuela.","El carné lo emite el IMT."],"Identificación, certificado médico, fotografía","Si tienes carné de fuera de la UE, puede haber un plazo para canjearlo tras obtener la residencia. Fuera de plazo, quizá tengas que examinarte.",null],
votar:["Saber dónde votas",["El censo electoral es automático según el domicilio de tu Cartão de Cidadão.","Comprueba tu colegio electoral en el portal del censo antes de cada elección."],null,"Si te mudas y no actualizas el domicilio de la tarjeta, sigues votando en la parroquia antigua.",null],
morada:["Actualizar el domicilio",["Cambia el domicilio del Cartão de Cidadão en línea con la Clave Móvil Digital o en un mostrador.","Confirma el código que recibes por carta en el nuevo domicilio.","El domicilio fiscal en Hacienda se actualiza con la tarjeta."],null,"El domicilio decide tu centro de salud, el colegio de tus hijos, dónde votas y a qué junta pides certificados.",null],
exames:["Inscribirte en los exámenes nacionales",["Mira qué exámenes de acceso pide la carrera que quieres.","Inscríbete en la secretaría de tu instituto dentro de plazo.","Las notas cuentan para la media de acceso."],null,"Puedes repetir exámenes para subir la nota de acceso, incluso después de terminar el bachillerato.",null],
candidatura:["Solicitar plaza en la universidad",["Pide la contraseña de solicitud en la web de la DGES.","En la 1.ª fase (verano) eliges hasta 6 pares carrera/institución.","Si no entras, la 2.ª y 3.ª fase ofrecen las plazas que sobran.","Una vez admitido(a), te matriculas en la institución."],null,"Hay cupos especiales (islas, emigrantes, discapacidad) y regímenes especiales que mucha gente desconoce.",null],
m23:["Acceso para mayores de 23 (Maiores de 23)",["Mira si la institución tiene plazas para mayores de 23 en tu carrera.","Inscríbete en las pruebas propias de la institución (escrita y entrevista).","Si apruebas, optas a las plazas de ese concurso."],null,"Con 23 años o más entras en la universidad sin exámenes nacionales ni media de bachillerato.",null],
mestrado:["Solicitud de máster",["Elige másteres y consulta las fases de solicitud de cada universidad.","Prepara CV, carta de motivación y certificado de notas.","Solicita directamente en el portal de la universidad."],null,"Muchas universidades tienen varias fases; en las últimas hay menos plazas pero también menos competencia.",null],
ctesp:["Solicitar un CTeSP",["Elige un curso técnico superior de 2 años en un politécnico.","Solicítalo directamente en el politécnico.","Incluye prácticas en una empresa en el último semestre."],null,"Sin exámenes nacionales obligatorios. Después puedes seguir a un grado con convalidaciones.",null],
mooc:["Curso corto en línea",["Busca cursos gratuitos de instituciones portuguesas en la plataforma NAU.","Elige uno con certificado.","Añade el certificado al CV y a LinkedIn."],null,"Los cursos cortos no sustituyen un título, pero muestran iniciativa y te ayudan a probar si te gusta el área.",null],
bolsa:["Pedir beca de la DGES",["Entra en la plataforma BeOn de la DGES.","Rellénala con los ingresos de tu hogar.","Solicítala cada curso, dentro de plazo."],"Declaración de la renta del hogar y NIF de todos","Incluye complemento de alojamiento si estudias lejos de casa. Pedirla fuera de plazo puede hacerte perder meses de beca.",null],
te:["Estatuto de trabajador-estudiante",["Pídelo en los servicios académicos.","Entrega una declaración de la empresa.","Informa a la empresa de tus horarios y exámenes."],null,"Puedes faltar el día del examen y el anterior sin perder sueldo, y tener horario adaptado.",null],
passe:["Abono de transporte",["Pídelo al operador de tu zona (en el área de Lisboa, navegante).","Lleva identificación y, si estudias, el certificado de matrícula."],null,"Los estudiantes universitarios hasta los 23 años tienen abono gratuito.",null],
erasmus:["Solicitar Erasmus+",["Habla con la Oficina de Relaciones Internacionales de tu facultad.","Las solicitudes abren cerca de un año antes.","Firmas un acuerdo de estudios con las asignaturas que harás fuera."],null,"Erasmus+ no es solo para estudiar: los recién titulados pueden hacer prácticas en el extranjero hasta 12 meses después de terminar.",null],
reconhecer:["Reconocer un título extranjero",["Mira en la DGES qué tipo de reconocimiento necesitas (automático, de nivel o específico).","Solicítalo en una universidad pública o en la DGES.","Para profesiones reguladas, inscríbete también en el colegio profesional (Ordem)."],null,"Para psicología, salud, ingeniería o abogacía, reconocer el título no basta: el colegio profesional tiene requisitos propios.",null],
iefp:["Inscribirte en el IEFP (servicio de empleo)",["Crea una cuenta en IEFPonline o ve a la oficina de empleo de tu zona.","Pide una entrevista con un técnico.","Tendrás acceso a ofertas, formación y prácticas."],"Identificación, NISS, certificado de estudios","Estar inscrito(a) abre la puerta a prácticas y ayudas que no encuentras en ningún otro sitio.",null],
garantiajovem:["Garantía Juvenil (Garantia Jovem)",["Para quien tiene hasta 29 años y no trabaja ni estudia.","Regístrate en línea.","Recibes propuestas de empleo, prácticas o formación."],null,"Es una de las vías más rápidas para unas prácticas pagadas.",null],
ces:["Cuerpo Europeo de Solidaridad",["Crea un perfil en el Portal Europeo de la Juventud (18 a 30 años).","Solicita proyectos de voluntariado en otro país.","Viaje, alojamiento y una ayuda están incluidos."],null,"Cuenta como experiencia internacional en el CV y está pagado.",null],
contrato:["Leer el contrato antes de firmar",["Revisa tipo de contrato, sueldo, horario y lugar.","Mira el periodo de prueba (por norma 90 días; más para el primer empleo).","Pide siempre una copia firmada."],null,"En el periodo de prueba cualquiera de las partes puede terminar sin justificación. Pasados 60 días ya hace falta preaviso.",null],
act:["Denuncia ante la ACT (inspección de trabajo)",["Reúne nóminas, contrato y mensajes.","Presenta la denuncia en línea o en persona en la ACT.","Comprueba tus cotizaciones en la Segurança Social Direta."],null,"Puedes denunciar sin que la empresa conozca tu identidad.",null],
estagio:["Prácticas ATIVAR.PT",["Inscríbete en el IEFP.","Busca ofertas de prácticas en IEFPonline o pide a una empresa que las solicite contigo.","Las prácticas son pagadas y tienen tutor."],null,"No son solo para recién titulados: hay condiciones para quien cambia de área y para desempleados de más edad.",null],
irsjovem:["Activar el IRS Jovem (rebaja fiscal joven)",["Hasta los 35 años, parte de los ingresos del trabajo queda exenta del impuesto sobre la renta durante 10 años.","Pide a la empresa que lo aplique ya en la retención mensual.","Confírmalo en la declaración anual."],null,"Los años sin ingresos no gastan tus 10 años de beneficio.",null],
eures:["Buscar trabajo en la UE (EURES)",["Busca ofertas en el portal EURES.","Habla con un consejero EURES en el IEFP.","Prepara un CV en formato Europass."],null,"Los consejeros EURES ayudan con contratos, impuestos y seguridad social del país de destino.",null],
cv:["CV y LinkedIn para la nueva área",["Haz una lista de lo que ya haces y tradúcelo al lenguaje de la nueva área.","Pon arriba los proyectos y la formación reciente.","Pide a 2 personas del área que lo revisen."],null,"Las competencias transferibles (gestionar personas, atender clientes, organizar) pesan más que el nombre del puesto anterior.",null],
rede:["Hablar con quien ya está allí",["Identifica de 5 a 10 personas en el área que quieres.","Pide 20 minutos para preguntar cómo es su día a día.","Pregunta: ¿qué te habría gustado saber antes?"],null,"Muchas vacantes se cubren por recomendación antes de anunciarse.",null],
qualifica:["Orientación en un Centro Qualifica",["Busca el Centro Qualifica más cercano.","Pide una sesión gratuita de diagnóstico y orientación.","Sales con un plan: formación, certificación o ambas."],null,"Estos centros existen para adultos de cualquier edad y son gratuitos.",null],
rvcc:["Certificar lo que ya sabes (RVCC)",["En el Centro Qualifica pide un proceso RVCC escolar o profesional.","Construyes un portafolio con tu experiencia.","Lo presentas ante un tribunal, que certifica las competencias."],null,"Años de experiencia pueden valer un certificado de 9.º o 12.º curso, o uno profesional, sin volver a clase.",null],
formacao:["Formación certificada",["Mira las formaciones modulares y los cursos de educación y formación de adultos (EFA).","Inscríbete en el centro de formación del IEFP o en una entidad certificada.","Algunas incluyen beca y ayuda de transporte."],null,"Si trabajas por cuenta ajena, tienes derecho a 40 horas de formación al año pagadas por la empresa.",null],
saida:["Dejar el empleo con seguridad",["Respeta el preaviso (30 días hasta 2 años de antigüedad, 60 días después).","Entrega la carta de dimisión por escrito y guarda copia.","Pide el pago proporcional de vacaciones y pagas extra."],null,"Si dimites por iniciativa propia (sin causa justa), no tienes derecho a prestación por desempleo.","A partir de aquí tus ingresos dependen solo del nuevo camino."],
paralelo:["Compaginarlo con tu empleo actual",["Lee el contrato: busca cláusulas de exclusividad o de no competencia.","No uses tiempo, clientes ni material de la empresa.","Define el momento de salida: por ejemplo, cuando los nuevos ingresos cubran 3 meses de sueldo."],null,"Sin cláusula de exclusividad puedes tener una actividad paralela, siempre que no compitas con tu empresa.",null],
desemprego:["Pedir la prestación por desempleo",["Pide a la empresa la declaración de situación de desempleo.","Inscríbete en el IEFP.","Haz la solicitud en la Segurança Social Direta en los 90 días siguientes a quedarte sin trabajo."],null,"Pasados los 90 días pierdes días de prestación. Dimitir por iniciativa propia no da derecho.",null],
validar:["Validar la idea antes de gastar",["Habla con 15 a 20 posibles clientes antes de crear nada.","Prueba una versión mínima: una página, una muestra, un servicio hecho a mano.","Calcula cuántas ventas al mes necesitas para cubrir costes."],null,"La mayoría de los negocios fracasa por falta de clientes, no de papeles. Valida primero, registra después.","Si nadie paga, te has ahorrado meses y dinero."],
planonegocio:["Plan y charla con un contable",["Haz una previsión de 12 meses: ventas, costes fijos y variables.","Llévala a un contable certificado y pregunta qué forma jurídica te conviene.","Decide cuánto te vas a pagar y cuánto reservar para impuestos."],null,"Una hora con un contable antes de empezar puede ahorrarte cientos de euros en impuestos mal elegidos.",null],
montanteunico:["Cobrar el paro de una sola vez",["Tienes que estar cobrando la prestación por desempleo e inscrito(a) en el IEFP.","Presentas al IEFP el proyecto de autoempleo.","Si se aprueba, recibes las prestaciones pendientes en un solo pago para invertir."],null,"Poca gente sabe que la prestación por desempleo puede adelantarse de una vez para crear tu negocio.","Dejas de cobrar la prestación cada mes; el dinero va al negocio."],
apoios:["Solicitar ayudas públicas",["Mira los programas abiertos en Startup Portugal y en el IEFP.","Habla con la oficina de emprendimiento o la incubadora de tu ayuntamiento.","Prepara presupuesto, plan y documentos con antelación."],null,"Las ayudas salen por convocatorias con plazos cortos. Las consigue quien ya tiene el plan listo cuando se abren.",null],
microcredito:["Microcrédito o préstamo bancario",["Compara líneas de crédito con garantía mutua en varios bancos.","Si el banco dice que no, el microcrédito existe para quien tiene poco acceso al crédito.","Lee la TAE (TAEG) y las garantías personales que piden."],null,"Muchos préstamos a pequeños negocios piden aval personal: si el negocio cierra, la deuda sigue siendo tuya.",null],
atividade:["Darte de alta como autónomo en Hacienda",["Entra en el Portal das Finanças con la Clave Móvil Digital.","Ve a Servicios > Actividad > Inicio y elige el código de tu actividad.","Elige el régimen simplificado y, si facturas hasta 15.000 € al año, la exención de IVA.","En cada cobro emite una factura-recibo en el Portal."],null,"Por encima de 15.000 € de facturación pasas al régimen normal de IVA el año siguiente. Por encima de 18.750 € el cambio es inmediato, en la misma factura que supera el límite.","A partir de ahora: declaración trimestral a la Seguridad Social y anexo B en la renta."],
ssindep:["Seguridad Social como autónomo",["El alta es automática al iniciar la actividad.","Los primeros 12 meses estás exento(a) de cotizaciones.","Después declaras lo cobrado en enero, abril, julio y octubre en la Segurança Social Direta."],null,"Si lo compaginas con un empleo por cuenta ajena, en ciertas condiciones quedas exento(a) como autónomo. Compruébalo antes de pagar.",null],
empresa:["Crear empresa al momento (Empresa na Hora)",["Elige un nombre de la lista de denominaciones preaprobadas o pide certificado de admisibilidad.","Ve a un mostrador Empresa na Hora o hazlo en línea.","Define el capital social (mínimo 1 € por socio).","Sales con la certificación permanente y el número de persona jurídica (NIPC)."],"Identificación, capital social, contable certificado","No necesitas 5.000 € de capital social: el mínimo es 1 € por socio. Pero un capital simbólico da mala imagen a bancos y proveedores.","La empresa debe llevar contabilidad organizada: necesitarás contable todos los meses."],
rcbe:["Declarar el titular real (RCBE)",["En los 30 días siguientes a crear la empresa, entra en el portal del RCBE.","Declara quién controla la empresa y accede con la Clave Móvil Digital.","Actualízalo siempre que cambien socios o administradores."],null,"Es obligatorio y mucha gente lo olvida. Sin él hay multas y bancos que bloquean operaciones.",null],
contabilista:["Contratar un contable certificado",["Busca un contable inscrito en la Orden de Contables Certificados.","Pide presupuesto con precio mensual cerrado.","Se encarga del IVA, nóminas, impuesto de sociedades e IES."],null,"Como administrador de tu propia empresa puede que tengas que cotizar aunque tu sueldo sea bajo. Pregunta antes de decidir cuánto te pagas.",null],
licenca:["Licencias de la actividad y del local",["Mira en ePortugal si tu actividad necesita licencia (restauración, alojamiento, salud, comercio).","Haz la comunicación previa o la solicitud de licencia en línea.","Antes de alquilar un local, confirma la licencia de uso en el ayuntamiento."],null,"Alquilar un local cuya licencia de uso no permite tu actividad es un error caro y muy común.",null],
seguros:["Seguros obligatorios",["Si contratas a alguien, el seguro de accidentes de trabajo es obligatorio.","Algunas actividades exigen seguro de responsabilidad civil.","Compara ofertas y lee las exclusiones."],null,"Como autónomo, por norma también necesitas seguro de accidentes de trabajo para ti.",null],
marca:["Proteger el nombre y la marca",["Busca en el INPI si el nombre ya está registrado.","Registra la marca en línea en las clases de tu negocio.","Registra el dominio .pt."],null,"El nombre de la empresa no protege la marca. Son registros distintos.",null],
obrigacoes:["Calendario fiscal del primer año",["Guarda todas las facturas de gastos del negocio.","Pon avisos para IVA, Seguridad Social e IRS (o impuesto de sociedades e IES).","Separa la cuenta personal de la del negocio."],null,"El primer año por cuenta propia suele traer una sorpresa en la renta del año siguiente. Aparta un 20 a 25% de cada cobro.",null],
orcamento:["Saber cuánto puedes pagar",["Suma los ingresos netos mensuales del hogar.","Añade todas las cuotas que ya pagas.","Simula la nueva cuota con el tipo 1 o 2 puntos más alto."],null,"El Banco de Portugal limita, por norma, la suma de cuotas al 50% de los ingresos. Los bancos usan esa cuenta para decidir.",null],
simular:["Simular la hipoteca en varios bancos",["Pide simulación en al menos 3 bancos.","Compara la TAE (TAEG), no solo la cuota.","Pide la ficha de información normalizada (FINE) de cada uno."],null,"Puedes negociar el diferencial. Un intermediario de crédito registrado en el Banco de Portugal compara por ti.",null],
garantia:["Garantía pública para jóvenes",["Hasta los 35 años, en la primera vivienda, pide al banco la garantía pública.","El Estado garantiza parte de la entrada, hasta permitir financiar el 100%.","Hay límites de valor de la vivienda y de ingresos."],null,"Los bancos no están obligados a aceptar todas las solicitudes. Pregunta ya en la primera simulación.",null],
cpcv:["Contrato de arras y señal",["Firmas el contrato-promesa de compraventa con el vendedor.","Pagas la señal acordada.","Pide que se reconozcan las firmas."],null,"Si desistes, pierdes la señal. Si desiste el vendedor, te la devuelve por duplicado.",null],
avaliacao:["Tasación bancaria",["El banco envía a un perito a tasar la vivienda.","El préstamo se calcula sobre el valor más bajo entre tasación y precio."],null,"Si la tasación sale por debajo del precio, la diferencia la pagas tú.",null],
imtjovem:["Exención joven de IMT e Impuesto de Sellos",["Hasta los 35 años, en la primera vivienda habitual y permanente.","El valor de la vivienda debe estar dentro del límite.","Decláralo en Hacienda antes de la escritura."],null,"Tienes que hacer de esa casa tu domicilio fiscal dentro de plazo, o pierdes la exención.",null],
imt:["Pagar el IMT y el Impuesto de Sellos",["Genera la liquidación del IMT en el Portal das Finanças antes de la escritura.","Paga el Impuesto de Sellos (0,8% del valor).","Lleva los justificantes a la escritura."],null,"En viviendas baratas para residencia propia, el IMT puede ser cero. Simúlalo en el Portal antes de negociar el precio.",null],
escritura:["Escritura y registro (Casa Pronta)",["Pide cita en el mostrador Casa Pronta de un Registro.","La escritura y el registro de la vivienda se hacen en el mismo sitio.","Sales con la vivienda registrada a tu nombre."],null,"En Casa Pronta todo se resuelve en un solo mostrador, normalmente más barato que notario y registro por separado.",null],
seguroscasa:["Seguros de vida y de hogar",["El banco exige seguro de vida y multirriesgo.","Pide ofertas a otras aseguradoras.","Preséntalas al banco."],null,"No estás obligado(a) a contratar los seguros con el banco que te da la hipoteca. Fuera suelen ser más baratos.",null],
imi:["IMI (IBI) cada año",["Hacienda te envía el recibo del IMI.","Paga en 1, 2 o 3 plazos según el importe."],null,"La vivienda habitual puede estar exenta de IMI durante 3 años, dentro de límites de valor e ingresos.",null],
procurar:["Buscar casa sin caer en estafas",["Visita siempre antes de pagar nada.","Pide el nombre del casero y confirma que es el dueño.","Desconfía de alquileres muy por debajo del mercado."],null,"Por ley, la fianza no puede superar 2 mensualidades, y el adelanto de rentas también está limitado a 2.",null],
arrendar:["Contrato de alquiler legal",["Exige contrato por escrito con plazo, renta y fianza.","El casero tiene que comunicarlo a Hacienda.","Pide recibos de renta electrónicos cada mes."],null,"Con recibos electrónicos, el alquiler desgrava en tu renta. Sin ellos, pierdes ese dinero.",null],
porta65:["Porta 65 Jovem (ayuda al alquiler)",["Para personas de 18 a 35 años.","Solicítala en línea en el Portal da Habitação.","El IHRU paga parte de tu alquiler."],"Contrato registrado, declaración de la renta, NIF","Las solicitudes abren en periodos concretos. Prepara los documentos antes.",null],
apoiorenda:["Ayuda extraordinaria al alquiler",["No tienes que solicitarla: es automática.","Se aplica si el alquiler supera el 35% de los ingresos, dentro de límites.","El contrato tiene que estar en Hacienda."],null,"Mucha gente tiene derecho y no lo sabe. Mira en la Segurança Social Direta si aparece el pago.",null],
gravidez:["Seguimiento del embarazo en el SNS",["Pide cita en el centro de salud en cuanto lo sepas.","Las consultas y pruebas rutinarias del embarazo son gratuitas.","Pide un justificante para el trabajo en cada consulta."],null,"Tienes derecho a ausentarte del trabajo para las consultas prenatales sin perder sueldo.",null],
prenatal:["Ayuda prenatal (abono pré-natal)",["A partir de la semana 13 de embarazo.","Pídela en la Segurança Social Direta.","Adjunta el informe médico con las semanas de embarazo."],null,"Mucha gente no sabe que puede cobrar la ayuda ya durante el embarazo.",null],
nascercidadao:["Registrar al bebé (Nascer Cidadão)",["En la maternidad, justo después del parto.","Se hacen el registro, el NIF, el NISS y el número de usuario de una vez.","Si allí no es posible, tienes 20 días para registrarlo en un Registro Civil."],"Identificación de los padres","Hazlo todo en la maternidad: te ahorra varias visitas a distintas oficinas.",null],
licencaparental:["Permiso parental",["Avisa a la empresa con antelación.","Pide el subsidio parental en la Segurança Social Direta.","Decidid cómo repartís los días entre los dos."],null,"El padre tiene días de permiso obligatorios. Y si compartís el permiso, ganáis días extra pagados.",null],
abono:["Prestación por hijo (abono de família)",["Pídela en la Segurança Social Direta tras registrar al bebé.","El importe depende del tramo de ingresos.","Demuestra los ingresos cuando te los pidan."],null,"El tramo se revisa. Si bajan los ingresos del hogar, pide una revisión.",null],
creche:["Plaza en la Creche Feliz",["Busca guarderías adheridas cerca de casa o del trabajo.","Inscribe directamente en la guardería, mejor durante el embarazo.","La asistencia es gratuita."],null,"Las plazas se acaban pronto. Inscribir durante el embarazo marca la diferencia.",null],
adocao:["Solicitar la adopción",["Empieza en los servicios de adopción de la Seguridad Social.","Sesión informativa, evaluación y formación.","Tras la aprobación, esperas una propuesta compatible."],null,"El permiso parental también se aplica a quien adopta.",null],
dependentes:["Dependientes en la renta",["Actualiza el hogar familiar en el Portal das Finanças.","Pide facturas con el NIF del niño.","Los gastos de salud y educación del niño desgravan."],null,"La deducción por dependiente es mayor hasta los 6 años.",null],
casamento:["Trámite de matrimonio",["Abre el expediente previo en un Registro Civil o en línea.","Elegid el régimen de bienes.","Fijad fecha y lugar."],null,"Sin capitulaciones, el régimen es de comunidad de bienes adquiridos. Pensadlo si uno de los dos tiene negocio o deudas.",null],
uniaofacto:["Acreditar la pareja de hecho",["Pide la declaración en la junta de parroquia (Junta de Freguesia) del domicilio común.","Firmáis una declaración bajo compromiso de honor."],null,"Para la renta conjunta cuentan 2 años de convivencia.",null],
medico:["Revisión rutinaria",["Pide cita con el médico de familia en el centro de salud o por el SNS 24.","Pide análisis rutinarios."],null,null,null],
psicologo:["Apoyo psicológico",["En el SNS, pide al médico de familia una consulta de psicología.","En privado, comprueba la colegiación en la Orden de Psicólogos.","La línea SNS 24 también ofrece asesoramiento psicológico."],null,"Las consultas de psicología están exentas de IVA y cuentan como gastos de salud en la renta.",null],
sns24:["Línea SNS 24",["Llama al 808 24 24 24, a cualquier hora.","Hacen triaje y te derivan.","Hay asesoramiento psicológico."],null,null,null],
irs:["Presentar la renta (IRS)",["Valida tus facturas en e-fatura antes de que acabe febrero.","Entre el 1 de abril y el 30 de junio, entra en el Portal das Finanças.","Simula individual y conjunta, si puedes, y presenta la mejor."],null,"El IRS es progresivo: ganar más nunca hace que cobres menos; solo la parte por encima de cada tramo paga más.",null],
efatura:["Validar facturas en e-fatura",["Pide factura con NIF en todo.","Entra en e-fatura y clasifica las facturas pendientes.","Hazlo antes de que acabe febrero."],null,"Las facturas sin clasificar pueden no contar para las deducciones.",null],
coima:["Regularizar la renta atrasada",["Presenta la declaración que falta.","Si lo haces antes de que te notifiquen, la multa se reduce."],null,null,null],
apoioat:["Pedir ayuda a Hacienda",["Pide cita en una oficina de Hacienda.","O usa el e-balcão del Portal."],null,null,null],
ehic:["Tarjeta Sanitaria Europea",["Pídela en la Segurança Social Direta.","Llega por correo."],null,"Cubre estancias temporales. Si te vas a vivir a otro país, tienes que darte de alta en su sistema de salud.",null],
moradafiscal:["Cambiar el domicilio fiscal al extranjero",["Actualiza el domicilio en el Portal das Finanças o en el Cartão de Cidadão.","Fuera de la UE, puede que tengas que nombrar representante fiscal.","Declara en la renta el año de salida."],null,"Si te vas a vivir fuera y no cambias el domicilio, Portugal puede seguir considerándote residente fiscal.",null],
consular:["Inscripción consular",["Inscríbete en el consulado portugués del país donde vas a vivir.","Tendrás acceso a documentos y apoyo en el extranjero."],null,null,null],
regressar:["Volver a Portugal",["Actualiza el domicilio fiscal a Portugal.","Inscríbete en el centro de salud.","Mira las ayudas vigentes para quien regresa."],null,"Hubo un régimen fiscal que reducía el IRS de los emigrantes que volvían (Programa Regressar). Comprueba si sigue vigente cuando vuelvas.",null],
pla:["Aprender portugués (PLA)",["Busca cursos de Portugués Lengua de Acogida en el IEFP o en escuelas.","Son gratuitos y dan certificado.","Haz el nivel que necesites (A2 o superior)."],null,"El certificado de portugués A2 es uno de los requisitos para pedir la nacionalidad.",null],
nacionalidade:["Pedir la nacionalidad",["Comprueba los años de residencia legal que se exigen ahora.","Reúne antecedentes penales, prueba de portugués y de residencia.","Solicítala en el IRN, en línea o en persona."],null,"Las normas y plazos de la nacionalidad se modificaron hace poco. Confírmalo en el IRN antes de contar los años.",null],
aforro:["Certificados de Ahorro (Certificados de Aforro)",["Abre una cuenta de ahorro en los CTT (correos) o en AforroNet.","Puedes suscribir desde importes bajos.","Puedes rescatar tras el plazo mínimo."],null,"Ahorro garantizado por el Estado, bueno para un fondo de emergencia.",null],
ppr:["Abrir un plan de ahorro para la jubilación (PPR)",["Compara comisiones y rentabilidad en bancos y aseguradoras.","Programa una transferencia mensual automática.","Guarda los justificantes para la renta."],null,"Parte de lo que pones en un PPR desgrava en la renta, con un límite que baja con la edad.",null],
renegociar:["Revisar préstamos y comisiones",["Haz una lista de todas las comisiones que pagas.","Compara en el Portal del Cliente Bancario.","Negocia o cambia de banco."],null,null,null],
carreira:["Revisar tu vida laboral",["Entra en la Segurança Social Direta.","Mira año a año lo cotizado.","Si faltan años, pregunta si puedes regularizarlos."],null,"Los años trabajados sin cotizar no cuentan para la jubilación. Descubrirlo a los 60 es demasiado tarde.",null],
simpensao:["Simular la pensión",["Usa el simulador de la Segurança Social Direta.","Mira el importe a la edad ordinaria, antes y después.","Repítelo cada año."],null,"Jubilarse antes de la edad ordinaria implica recortes permanentes. Trabajar más allá aumenta la pensión.",null],
pensao:["Pedir la pensión de jubilación",["Solicítala en la Segurança Social Direta a partir de la edad aplicable.","Añade los periodos trabajados en otros países, si los hay.","Recibes la resolución y el primer pago."],null,"Los años trabajados en otros países de la UE suman para la jubilación.",null],
cuidador:["Estatuto del Cuidador Informal",["Pídelo en la Segurança Social Direta o en una oficina.","Adjunta información de salud de la persona cuidada.","Tendrás acceso a descanso del cuidador y apoyo psicosocial."],null,"En ciertas condiciones hay un subsidio para el cuidador principal.",null],
cartasocial:["Encontrar apoyo para mayores",["Busca en la Carta Social por municipio.","Contacta residencias, centros de día o ayuda a domicilio.","Pregunta por listas de espera y copagos."],null,null,null],
voluntariado:["Encontrar voluntariado",["Pregunta en tu junta de parroquia o ayuntamiento por el voluntariado local.","Elige una causa y un horario."],null,null,null],
rentev:["Testamento vital",["Rellena el modelo de Directiva Anticipada de Voluntad.","Entrégalo en el centro de salud con firma reconocida.","Queda registrado en el RENTEV."],null,"Puedes nombrar un representante sanitario que decida por ti si no puedes.",null],
testamento:["Hacer testamento",["Pide cita en una notaría.","Decide qué dejas y a quién."],null,"Una parte de la herencia va obligatoriamente a hijos y cónyuge (la legítima).",null]
};

function chTr(i){return LANG==="pt"?null:CHI[LANG][i]}
function chText(i){const c=CH[i],o=chTr(i);return o?{eb:o.eb,t:o.t,p:o.p}:{eb:c.eb,t:c.t,p:c.p}}
function choiceText(i,x){const c=CH[i],o=chTr(i),k=c.ch.indexOf(x);return o&&o.c[k]?{t:o.c[k][0],o:o.c[k][1]}:{t:x.t,o:x.o}}
function evText(ev){const o=LANG==="pt"?null:EVI[LANG][ev.id];return o?{t:o[0],o:o[1]}:{t:ev.t,o:ev.o}}
const SLB=()=>({m:u("st_m"),s:u("st_s"),b:u("st_b"),r:u("st_r"),c:u("st_c")});
function vNew(){
  const job={estudante:0,empregado:2,independente:2,desempregado:0,reformado:-1}[P.work],f={};
  if(P.work==="estudante")f.estudante=1;if(P.parceiro)f.parceiro=1;
  let i=CH.findIndex(c=>c.age>=P.age);if(i<0)i=CH.length-1;
  V={age:Math.max(P.age,CH[i].age),i,stats:{m:P.pou,s:70,b:60,r:58,c:P.edu==="mest"?55:P.edu==="lic"?45:35},f,job,casa:P.casa,kids:P.filhos,log:[],phase:"scene",out:null,hist:[]};
  skipTo();store("ll3_v",V);
}
function skipTo(){while(V.i<CH.length&&CH[V.i].skip&&CH[V.i].skip(V))V.i++;if(V.i>=CH.length)V.phase="end";else V.age=Math.max(V.age,CH[V.i].age)}
const clamp=v=>Math.max(0,Math.min(100,v));
function vFx(fx){const d={};for(const k in fx){if(k==="m")V.stats.m+=fx[k];else V.stats[k]=clamp(V.stats[k]+fx[k]);d[k]=fx[k]}return d}
function yearly(){const h={lis:1.5,lit:1,int:.6,ilhas:1,fora:1}[P.reg];let n=V.job===-1?2600:V.job===0?-800:[0,1400,3600,6500][V.job];n+={pais:900,partilha:-300,arrenda:-900,propria:-400}[V.casa]*(V.casa==="pais"?1:h);n-=V.kids*1700;if(V.f.poupa)n+=500;return Math.round(n)}
function snap(){const c=JSON.parse(JSON.stringify(V));delete c.hist;return c}
function vChoose(k){
  const c=CH[V.i],opts=c.ch.filter(x=>!x.req||x.req(V)),ch=opts[k];V.hist.push(snap());
  const d=vFx(valFx(ch.fx||{},ch.t));(ch.set||[]).forEach(s=>V.f[s]=1);
  if(ch.job!==undefined)V.job=ch.job;if(ch.casa)V.casa=ch.casa;if(ch.kids)V.kids+=ch.kids;if(ch.x)ch.x(V);
  V.log.push({age:V.age,ci:V.i,k:c.ch.indexOf(ch)});V.out={kind:"choice",ci:V.i,k:c.ch.indexOf(ch),d,st:ch.st||[]};V.phase="out";store("ll3_v",V);render();toTop();
}
function vNext(){
  V.hist.push(snap());const cur=V.age;V.i++;skipTo();
  if(V.phase!=="end"){const yrs=V.age-cur;if(yrs>0){V.stats.m+=yearly()*yrs;if(V.age>=60)V.stats.s=clamp(V.stats.s-yrs)}
   if(V.age>=22)delete V.f.estudante;
   const ev=EV.find(e=>!V.f["ev_"+e.id]&&e.when(V));
   if(ev){V.f["ev_"+ev.id]=1;if(Math.random()<(ev.p||1)){const d=vFx(ev.fx);V.log.push({age:V.age,ev:ev.id});V.out={kind:"event",ev:ev.id,d,st:ev.st};V.phase="out";store("ll3_v",V);render();toTop();return}}
   V.phase="scene"}
  V.out=null;store("ll3_v",V);render();toTop();
}
function vBack(){if(!V.hist.length)return;const h=V.hist.pop(),hist=V.hist;V=h;V.hist=hist;store("ll3_v",V);render();toTop()}
function deltas(d){const lb=SLB();return `<div class="deltas">${Object.keys(d).filter(k=>d[k]).map(k=>`<span class="d ${d[k]>0?"up":"dn"}">${lb[k]} ${d[k]>0?"+":"−"}${k==="m"?eur(Math.abs(d[k])):Math.abs(d[k])}</span>`).join("")}</div>`}
function logLine(l){if(l.ev){const e=evText(EV.find(x=>x.id===l.ev));return {eb:u("sim_surprise"),t:e.t}}const c=CH[l.ci];return {eb:chText(l.ci).eb,t:choiceText(l.ci,c.ch[l.k]).t}}

  else if(V.phase==="out"){const o=V.out,txt=o.kind==="event"?evText(EV.find(x=>x.id===o.ev)):choiceText(o.ci,CH[o.ci].ch[o.k]);
   body=`<section class="${o.kind==="event"?"event":"outcome"}"><span class="eyebrow">${o.kind==="event"?u("sim_surprise"):u("v_chose")} · ${V.age} ${u("years")}</span><h2>${esc(txt.t)}</h2><p>${esc(txt.o)}</p>${deltas(o.d)}
   ${o.st.length?`<h3>${u("v_irl")}</h3><ol class="stations flat">${o.st.map(station).join("")}</ol>`:`<p class="note">${u("v_nopaper")}</p>`}
   <div class="row-btns"><button class="btn primary" id="vNext">${u("v_cont")}</button></div></section>`}
  else body=`<section class="scene"><span class="eyebrow">${u("v_end")}</span><h2>${u("v_endh")}</h2><div class="story">${V.log.map(l=>{const x=logLine(l);return `<div><span>${l.age} ${u("years")} · ${esc(x.eb)}</span>${esc(x.t)}</div>`}).join("")}</div></section>`;
  return `<div class="narrow">${top}<p class="note">${u("v_illus")}${P.vals.length?"":" "+u("v_novals")}</p>${body}${ctl}</div>`;

// arte de linhas (decorativa, gerada a partir de uma semente)
function routeArt(seed,cls){
  let r=seed%233280||7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const ps=[];for(let i=0;i<3;i++){let y=25+rnd()*70,d=`M-10 ${y.toFixed(1)}`,x=-10;while(x<420){const nx=x+70+rnd()*70,ny=Math.max(14,Math.min(106,y+(rnd()-.5)*70));d+=` L${(nx-26).toFixed(1)} ${y.toFixed(1)} L${nx.toFixed(1)} ${ny.toFixed(1)}`;x=nx;y=ny}ps.push(d)}
  const dots=[];for(let i=0;i<5;i++)dots.push([30+rnd()*340,20+rnd()*80]);
  return `<svg class="art ${cls||""}" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${ps.map((d,i)=>`<path d="${d}" fill="none" stroke="currentColor" stroke-width="${i?3:6}" stroke-opacity="${i?.28:.85}" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}${dots.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--surface)" stroke="currentColor" stroke-width="3" stroke-opacity=".85"/>`).join("")}</svg>`;
}
const seedOf=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)>>>0;

const GVALS={
 negocio:f=>({liberdade:1,carreira:1,seguranca:-1,estabilidade:-1,tempo:f.ritmo==="total"?-1:-1}),
 carreira:f=>({carreira:1,estabilidade:f.manter==="sim"?0:-1,seguranca:f.manter==="sim"?0:-1,tempo:-1}),
 casa:f=>f.modo==="comprar"?{estabilidade:1,seguranca:1,liberdade:-1}:{liberdade:1,estabilidade:-1},
 mudar:f=>({aventura:1,estabilidade:-1,comunidade:-1}),
 filho:f=>({familia:1,tempo:-1,liberdade:-1}),
 estudar:f=>({carreira:1,tempo:-1,seguranca:-1}),
 emigrar:f=>({aventura:1,carreira:1,familia:-1,comunidade:-1}),
 reforma:f=>({tempo:1,seguranca:f.quando==="antes"?-1:1,carreira:-1}),
 sair:f=>({liberdade:1,seguranca:-1,tempo:-1,familia:f.tipo==="partilhar"?0:-1,comunidade:f.tipo==="partilhar"?1:0}),
 emprego:f=>({seguranca:f.tipo==="contrato"?1:0,carreira:1,tempo:-1,liberdade:f.tipo==="verdes"?1:-1,estabilidade:f.tipo==="contrato"?1:-1})};
function fitOf(gid,f){
  const eff=(GVALS[gid]||(()=>({})))(f);const w=[3,2,1];let score=0;
  const rows=P.vals.map((v,i)=>{const d=eff[v]||0;score+=d*w[i];return {v,d}});
  return {rows,score};
}
function fitHtml(gid,f,compact){
  if(!P.vals.length)return `<div class="fit empty"><span>${u("vals_none")}</span><button class="btn sm" data-sheet="1">${u("vals_set")}</button></div>`;
  const ft=fitOf(gid,f),pos=ft.rows.some(r=>r.d>0),neg=ft.rows.some(r=>r.d<0);
  const sum=pos&&neg?u("fit_mixed"):pos?u("fit_for"):neg?u("fit_against"):u("fit_eq");
  const chips=ft.rows.map(r=>`<span class="fv ${r.d>0?"up":r.d<0?"dn":"eq"}">${r.d>0?"↑":r.d<0?"↓":"="} ${esc(vLabel(r.v))}</span>`).join("");
  return compact?`<div class="fitc"><div class="fvrow">${chips}</div><p class="note">${sum}</p></div>`:`<section class="fit"><div class="fit-h"><b>${u("fit_h")}</b><span class="fit-sum ${pos&&!neg?"good":neg&&!pos?"bad":""}">${sum}</span></div><div class="fvs">${chips}</div></section>`;
}

function irsTax(col){let t=0,prev=0;for(const [lim,r] of IRS_BR){if(col<=prev)break;t+=(Math.min(col,lim)-prev)*r;prev=lim}return t}
function irsAnnual(bruto,jy){ // bruto anual cat. A; jy = ano do IRS Jovem (0 = não tem)

  return Math.max(0,Math.round(irsTax(col)))}

function tmRun(gid,d,recOnly){
  const g=GI[gid],pl=plan(gid,d.forks),f=d.forks,meta=pl.meta,n=k=>numOf(gid,d,k);
  const steps=[];let wk=0;
  pl.all.forEach(id=>{const s=S[id];if(isHave(id)){steps.push({id,m:0,k:"have"});return}
    const a=recOnly?{k:"rec"}:(d.acts[id]||{}),k=a.k||"rec";
    const m=Math.min(TM_H,Math.floor(wk/4.33));
    const mid=c=>Array.isArray(c)?(c[0]+c[1])/2:(c||0);
    steps.push({id,m,k,cost:k==="skip"?0:k==="alt"&&a.val!=null?Number(a.val):mid(s.c),cm:k==="skip"?0:(s.cm||0),txt:a.txt||""});
    if(k!=="skip")wk+=s.w||0});
  const lastStep=steps.length?Math.max(...steps.map(x=>x.m)):0;
  const stepM=id=>{const x=steps.find(s=>s.id===id);return x?x.m:null};
  const ev=[],money=[],risk=[],prog=[],inc=[];
  let cash=P.pou-n("inv"),r0=meta.risco*10,rk=r0,cmAcc=0,flags={};
  const push=(m,t,kind)=>ev.push({m,t,kind:kind||"info"});
  if(n("inv"))push(0,u("tm_ev_inv",{v:eur(n("inv"))}),"money");
  for(let m=0;m<=TM_H;m++){
    let inn=n("rend"),out=n("custo");
    steps.filter(s=>s.m===m&&s.k!=="have").forEach(s=>{const st=stp(s.id);
      if(s.k==="skip"){rk+=15;push(m,u("tm_ev_skip",{t:st.t}),"bad");push(Math.min(TM_H,m+3),st.x?u("tm_ev_skipx",{t:st.t,x:st.x}):u("tm_ev_skipg",{t:st.t}),"bad")}
      else{out+=s.cost;cmAcc+=s.cm;if(s.k==="alt"){rk+=5;push(m,u("tm_ev_alt",{t:st.t})+(s.txt?" “"+s.txt.slice(0,80)+"”":"")+(s.cost?" · "+eur(s.cost):""),"alt")}
        else push(m,u("tm_ev_done",{t:st.t})+(s.cost?" · "+eur(s.cost):""),"ok");if(st.i)push(m,st.i,"info")}});
    out+=cmAcc;
    // regras de cada objetivo
    if(gid==="negocio"){const st=Math.max(stepM("atividade")??stepM("empresa")??lastStep,0);
      if(f.ritmo==="total"&&P.work==="empregado"&&m>=(stepM("saida")??0))inn-=n("rend");
      if(m>=st){const rec=n("fat")*Math.min(1,(m-st+1)/Math.max(1,n("ramp")));inn+=rec;out+=n("cneg");
        if(f.forma==="eni"){if(m-st>=12){const ss=rec*.7*.214;out+=ss;if(!flags.ss){flags.ss=1;push(m,u("tm_ev_ssend",{v:eur(ss)}),"money")}}
          if(!flags.iva&&rec*12>15000){flags.iva=1;push(m,u("tm_ev_iva"),"warn")}}
        else if(m-st===12)push(m,u("tm_ev_irc"),"info")}
      if(m===st)push(m,u("tm_ev_open"),"ok")}
    if(gid==="emprego"||gid==="carreira"){const st=gid==="emprego"?(stepM("contrato")??stepM("atividade")??lastStep):lastStep;const jy=P.age<=35?Math.floor((m-st)/12)+1:0;
      if(gid==="carreira"&&m<st)inn-=n("perda");
      if(m>=st){const nm=netMonthly(n("bruto"),m>=st?jy:0);inn+=nm.net-n("rend");
        if(m===st)push(m,u("tm_ev_job",{v:eur(nm.net)})+(jy?" "+u("tm_ev_irsj"):""),"money");
        if(gid==="emprego"&&m===st+3)push(m,u("tm_ev_trial"),"info")}}
    if(gid==="casa"||gid==="sair"||gid==="mudar"){const st=stepM("arrendar")??stepM("escritura")??lastStep;
      if(m>=st){out+=n("renda");if(m===st){const tot=Math.max(1,n("rend")),pc=Math.round(n("renda")/tot*100);push(m,u("tm_ev_rent",{v:eur(n("renda")),p:pc}),pc>35?"warn":"ok")}}}
    if(gid==="filho"){const b=n("mes");
      if(m>=b){out+=n("cfilho");if(m===b)push(m,u("tm_ev_birth"),"ok")}
      const lm=Math.round(n("lic")/30);if(m>=b&&m<b+lm&&n("lic")>=150){inn-=n("bruto")*.2}
      if(m===b+lm)push(m,u("tm_ev_leave"),"info")}
    if(gid==="estudar"){const st=lastStep;if(m>=st){out+=n("propina")/12;inn-=n("perda");if(m===st)push(m,u("tm_ev_study",{v:eur(n("propina"))}),"money")}}
    if(gid==="emigrar"){const st=lastStep;if(m>=st){inn+=n("rend2")-n("rend");out+=n("custo2")-n("custo");if(m===st)push(m,u("tm_ev_move"),"ok")}}
    if(gid==="reforma"){out+=n("poup");if(!flags.p&&m===12){flags.p=1;push(m,u("tm_ev_pens",{v:eur(n("poup")*12)}),"money")}}
    if(isApril(m)&&(inn>0))push(m,u("tm_ev_irs"),"info");
    if(m===0)cash+=0;else cash+=inn-out;
    money.push(Math.round(cash));inc.push(Math.round(inn-out));
    const done=steps.filter(s=>s.k!=="skip"&&s.m<=m).length;prog.push(Math.round(done/Math.max(1,steps.length)*100));
    risk.push(Math.max(0,Math.min(100,Math.round(rk))));

function tmAct(gid,fn){tmPush(gid);tmState(gid).flash="";fn();tmSave();save();render()}
function tmSetDec(gid,id,k){
  const s=tmState(gid),b=s.br[s.act],d=brData(gid,b),run=tmRun(gid,d),st=run.steps.find(x=>x.id===id);if(!st)return;
  const past=st.m<=s.cur;
  tmAct(gid,()=>{
    if(past&&(d.acts[id]||{}).k!==k&&!((d.acts[id]||{}).k==null&&k==="rec")){ // mudar o passado cria um ramo novo
      const nb={name:"",from:st.m,forks:Object.assign({},d.forks),acts:JSON.parse(JSON.stringify(d.acts)),n:Object.assign({},d.n)};
      nb.acts[id]=Object.assign({},nb.acts[id]||{},{k});s.br.push(nb);s.act=s.br.length-1;s.cur=st.m;s.flash=u("tm_newbr",{b:bName(nb,s.act),m:mName(st.m)});
    }else{const A=b.live?U.acts:(b.acts=b.acts||{});if(k==="rec")delete A[id];else A[id]=Object.assign({},A[id]||{},{k})}})}
function tmSetFork(gid,fk,v){

document.addEventListener("click",e=>{
  const r=e.target.closest("[data-tmx]");if(r&&TMS.gid){const svg=r.ownerSVGElement,bb=svg.getBoundingClientRect(),W=680,pl=66,pr=14;const px=(e.clientX-bb.left)/bb.width*W;const m=Math.round((px-pl)/(W-pl-pr)*TM_H);const s=tmState(TMS.gid);s.prev=s.cur;s.cur=Math.max(0,Math.min(TM_H,m));tmSave();render();return}

  if(d.tmgoal){TMS.gid=d.tmgoal;tmSave();U.tab="simular";render();toTop();e.stopImmediatePropagation();return}

  if(b.id==="tmPlay"){tmTogglePlay();e.stopImmediatePropagation();return}
  if(b.id==="tmUndo"){const s=tmState(gid);if(!s.hist.length)return;s.fut.push(tmSnap(gid));tmRestore(gid,s.hist.pop());tmSave();save();render();e.stopImmediatePropagation();return}
  if(b.id==="tmRedo"){const s=tmState(gid);if(!s.fut.length)return;s.hist.push(tmSnap(gid));tmRestore(gid,s.fut.pop());tmSave();save();render();e.stopImmediatePropagation();return}
  if(d.tmdec){tmSetDec(gid,d.tmdec,d.k);e.stopImmediatePropagation();return}
  if(d.tmfork){tmSetFork(gid,d.tmfork,d.v);e.stopImmediatePropagation();return}

  if(d.tmguide){U.goal=gid;U.tab="planear";U.open[d.tmguide]=true;render();setTimeout(()=>{const el=document.querySelector(`[data-open="${d.tmguide}"]`);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"center"})},60);e.stopImmediatePropagation();return}
},true);

  if(TMS.ai&&sampleState==="ok")return `<div class="row-btns"><button class="btn sm" id="tmAiBack">← ${u("tm_aiback")}</button></div>`+vSimularAI();
